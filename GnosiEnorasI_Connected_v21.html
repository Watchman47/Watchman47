<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gnósi-Enórasi — Implementation Assurance Platform</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   GNÓSI-ENÓRASI — EXECUTIVE MOTION SYSTEM
   Smooth · Tactile · Staggered · Contextual
═══════════════════════════════════════════════════════════════════ */

/* ── Design tokens ──────────────────────────────────────────────── */
:root{
  --ease-out-expo: cubic-bezier(0.16,1,0.3,1);
  --ease-out-quart: cubic-bezier(0.25,1,0.5,1);
  --ease-out-back: cubic-bezier(0.34,1.56,0.64,1);
  --ease-in-out-sine: cubic-bezier(0.37,0,0.63,1);
  --ease-spring: cubic-bezier(0.175,0.885,0.32,1.275);
  --dur-instant: 80ms;
  --dur-fast: 160ms;
  --dur-base: 260ms;
  --dur-slow: 420ms;
  --dur-xslow: 640ms;
  --teal: #0D7377;
  --teal-light: rgba(13,115,119,0.08);
  --purple: #5B3FD4;
  --purple-light: rgba(91,63,212,0.08);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08),0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.10),0 4px 8px rgba(0,0,0,0.06);
  --shadow-xl: 0 24px 56px rgba(0,0,0,0.12),0 8px 16px rgba(0,0,0,0.06);
  --shadow-glow-teal: 0 0 0 3px rgba(13,115,119,0.18);
  --shadow-glow-purple: 0 0 0 3px rgba(91,63,212,0.18);
}

/* ── Base reset ─────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f4f5f7;color:#111827;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font-family:inherit}

/* ── Scrollbar ──────────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:rgba(0,0,0,0.12);border-radius:4px;
  transition:background var(--dur-fast) ease;
}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.22)}

/* ══ KEYFRAMES ══════════════════════════════════════════════════ */

/* Spinner */
@keyframes spin{to{transform:rotate(360deg)}}

/* Entry animations */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeInDown{
  from{opacity:0;transform:translateY(-12px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeInLeft{
  from{opacity:0;transform:translateX(-16px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes fadeInRight{
  from{opacity:0;transform:translateX(16px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes slideIn{
  from{opacity:0;transform:translateX(-8px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes scaleIn{
  from{opacity:0;transform:scale(0.95)}
  to{opacity:1;transform:scale(1)}
}
@keyframes scaleInBounce{
  from{opacity:0;transform:scale(0.92)}
  60%{transform:scale(1.02)}
  to{opacity:1;transform:scale(1)}
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes panelIn{
  from{opacity:0;transform:translateX(20px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes modalIn{
  from{opacity:0;transform:scale(0.96) translateY(8px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}

/* Ambient / continuous */
@keyframes shimmer{
  0%{background-position:-200% 0}
  100%{background-position:200% 0}
}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:0.5}
}
@keyframes pulseBadge{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(91,63,212,0.25)}
  50%{box-shadow:0 0 0 5px rgba(91,63,212,0)}
}
@keyframes glowTeal{
  0%,100%{box-shadow:0 0 0 0 rgba(13,115,119,0.25)}
  50%{box-shadow:0 0 0 5px rgba(13,115,119,0)}
}
@keyframes countUp{
  from{transform:translateY(6px);opacity:0}
  to{transform:translateY(0);opacity:1}
}
@keyframes barFill{
  from{width:0}
  to{width:var(--bar-target,100%)}
}
@keyframes ripple{
  from{transform:scale(0);opacity:0.4}
  to{transform:scale(4);opacity:0}
}
@keyframes nodeEntry{
  from{opacity:0;r:0}
  to{opacity:1;r:var(--node-r,20)}
}
@keyframes edgeDraw{
  from{stroke-dashoffset:var(--path-len,200)}
  to{stroke-dashoffset:0}
}
@keyframes toastSlide{
  from{opacity:0;transform:translateX(20px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes tabSwitch{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:translateY(0)}
}

/* ══ UTILITY CLASSES ════════════════════════════════════════════ */

.spin{animation:spin 0.8s linear infinite}

/* Entry */
.fadein{animation:fadeIn var(--dur-base) var(--ease-out-expo) both}
.slidein{animation:slideIn var(--dur-base) var(--ease-out-expo) both}
.scalein{animation:scaleIn var(--dur-base) var(--ease-out-expo) both}
.scaleInBounce{animation:scaleInBounce var(--dur-slow) var(--ease-out-back) both}
.panelin{animation:panelIn var(--dur-base) var(--ease-out-expo) both}
.modalin{animation:modalIn var(--dur-slow) var(--ease-out-expo) both}

/* Stagger delays — apply to children */
.stagger > *:nth-child(1){animation-delay:0ms}
.stagger > *:nth-child(2){animation-delay:50ms}
.stagger > *:nth-child(3){animation-delay:100ms}
.stagger > *:nth-child(4){animation-delay:150ms}
.stagger > *:nth-child(5){animation-delay:200ms}
.stagger > *:nth-child(6){animation-delay:250ms}
.stagger > *:nth-child(7){animation-delay:300ms}
.stagger > *:nth-child(8){animation-delay:350ms}
.stagger > *:nth-child(n+9){animation-delay:400ms}

/* Stagger pattern — cards animate in from bottom */
.stagger-cards > *{
  animation:fadeInUp var(--dur-slow) var(--ease-out-expo) both;
}
.stagger-cards > *:nth-child(1){animation-delay:0ms}
.stagger-cards > *:nth-child(2){animation-delay:60ms}
.stagger-cards > *:nth-child(3){animation-delay:120ms}
.stagger-cards > *:nth-child(4){animation-delay:180ms}
.stagger-cards > *:nth-child(5){animation-delay:240ms}
.stagger-cards > *:nth-child(n+6){animation-delay:300ms}

/* ══ BUTTON MICRO-INTERACTIONS ══════════════════════════════════ */

button{
  position:relative;overflow:hidden;
  transition:
    transform var(--dur-fast) var(--ease-out-back),
    box-shadow var(--dur-fast) ease,
    background var(--dur-base) ease,
    border-color var(--dur-base) ease,
    color var(--dur-base) ease,
    opacity var(--dur-fast) ease;
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
}
button:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:var(--shadow-md);
}
button:active:not(:disabled){
  transform:translateY(0) scale(0.98);
  box-shadow:var(--shadow-sm);
  transition-duration:var(--dur-instant);
}
button:disabled{
  opacity:0.55;
  cursor:not-allowed;
}

/* Ripple layer */
.ripple-effect{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,0.35);
  pointer-events:none;
  animation:ripple 0.5s var(--ease-out-expo) forwards;
}

/* ══ CARD MICRO-INTERACTIONS ════════════════════════════════════ */

.card-interactive{
  transition:
    transform var(--dur-base) var(--ease-out-expo),
    box-shadow var(--dur-base) ease;
  cursor:pointer;
}
.card-interactive:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-lg);
}
.card-interactive:active{
  transform:translateY(0) scale(0.99);
  box-shadow:var(--shadow-sm);
  transition-duration:var(--dur-instant);
}

/* ══ SCORE / BADGE ANIMATIONS ═══════════════════════════════════ */

.score-anim{
  animation:countUp var(--dur-base) var(--ease-out-expo) both;
}
.badge-pulse{
  animation:pulseBadge 2s ease-in-out infinite;
}
.glow-purple{
  animation:glowPulse 2.5s ease-in-out infinite;
}
.glow-teal{
  animation:glowTeal 2.5s ease-in-out infinite;
}

/* ══ PROGRESS BAR ANIMATION ═════════════════════════════════════ */

.bar-animated{
  animation:barFill var(--dur-xslow) var(--ease-out-expo) both;
  animation-delay:var(--bar-delay,100ms);
}

/* ══ TAB TRANSITIONS ════════════════════════════════════════════ */

.tab-content{
  animation:tabSwitch var(--dur-base) var(--ease-out-expo) both;
}

/* ══ GRAPH ELEMENTS ═════════════════════════════════════════════ */

.graph-node{
  transition:
    r var(--dur-base) var(--ease-out-back),
    filter var(--dur-base) ease;
  cursor:pointer;
}
.graph-node:hover{
  filter:drop-shadow(0 0 6px rgba(91,63,212,0.4));
}
.graph-edge{
  transition:opacity var(--dur-base) ease, stroke-width var(--dur-base) ease;
}
.graph-edge:hover{opacity:0.8;stroke-width:3}

/* ══ INPUT FOCUS ════════════════════════════════════════════════ */

input,select,textarea{
  transition:
    border-color var(--dur-fast) ease,
    box-shadow var(--dur-fast) ease;
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:#5B3FD4 !important;
  box-shadow:var(--shadow-glow-purple);
}

/* ══ LOADING SHIMMER ════════════════════════════════════════════ */

.shimmer{
  background:linear-gradient(
    90deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.6) 50%,
    rgba(255,255,255,0) 100%
  );
  background-size:200% 100%;
  animation:shimmer 1.4s ease-in-out infinite;
}

/* ══ ALERT / CONFLICT BADGE ═════════════════════════════════════ */

.alert-badge-anim{
  animation:pulseBadge 1.8s ease-in-out infinite;
}

/* ══ SIDE PANEL ═════════════════════════════════════════════════ */

.side-panel-enter{
  animation:panelIn var(--dur-base) var(--ease-out-expo) both;
}

/* ══ WHO/WHAT/WHY PANEL ═════════════════════════════════════════ */

.www-panel{
  animation:slideUp var(--dur-slow) var(--ease-out-expo) both;
}

/* ══ MODAL OVERLAY ══════════════════════════════════════════════ */

.modal-overlay-enter{
  animation:fadeIn var(--dur-base) ease both;
}
.modal-content-enter{
  animation:modalIn var(--dur-slow) var(--ease-out-expo) both;
}

/* ══ LINK / INTERACTIVE TEXT ════════════════════════════════════ */

a{
  transition:color var(--dur-fast) ease, opacity var(--dur-fast) ease;
}

/* ══ REDUCED MOTION ACCESSIBILITY ══════════════════════════════ */

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:1ms !important;
    animation-delay:0ms !important;
    transition-duration:1ms !important;
  }
}


@keyframes dashFlow{
  from{stroke-dashoffset:26}
  to{stroke-dashoffset:0}
}

<div id="root"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   GNÓSI-ENÓRASI — EXECUTIVE MOTION ENGINE (vanilla JS)
   Runs before React hydration — enhances interactivity progressively
═══════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';

  /* ── 1. BUTTON RIPPLE ─────────────────────────────────────────── */
  function addRipple(e){
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.4;
    const x = e.clientX - rect.left - size/2;
    const y = e.clientY - rect.top - size/2;
    const el = document.createElement('span');
    el.className = 'ripple-effect';
    el.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;`;
    btn.appendChild(el);
    el.addEventListener('animationend', () => el.remove(), {once:true});
  }

  function attachRipples(root){
    root.querySelectorAll('button:not([data-ripple])').forEach(btn => {
      btn.setAttribute('data-ripple','1');
      btn.addEventListener('click', addRipple);
    });
  }

  /* ── 2. PROGRESS BAR FILL ANIMATION ──────────────────────────── */
  function animateBars(root){
    root.querySelectorAll('[data-bar]:not([data-bar-done])').forEach(bar => {
      const target = parseFloat(bar.getAttribute('data-bar')) || 0;
      bar.setAttribute('data-bar-done','1');
      bar.style.setProperty('--bar-target', target + '%');
      bar.style.width = '0%';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          bar.style.transition = `width 640ms cubic-bezier(0.16,1,0.3,1)`;
          bar.style.width = target + '%';
        });
      });
    });
  }

  /* ── 3. SCORE COUNTER ANIMATION ──────────────────────────────── */
  function animateScore(el, target, suffix){
    const dur = 700, start = performance.now();
    const from = 0;
    function step(now){
      const t = Math.min((now - start) / dur, 1);
      const ease = 1 - Math.pow(1-t, 3);
      const val = Math.round(from + (target - from) * ease);
      el.textContent = val + (suffix||'');
      if(t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function attachScoreCounters(root){
    root.querySelectorAll('[data-score]:not([data-score-done])').forEach(el => {
      const target = parseFloat(el.getAttribute('data-score')) || 0;
      const suffix = el.getAttribute('data-score-suffix') || '';
      el.setAttribute('data-score-done','1');
      el.textContent = '0' + suffix;
      const obs = new IntersectionObserver(entries => {
        if(entries[0].isIntersecting){
          animateScore(el, target, suffix);
          obs.disconnect();
        }
      }, {threshold:0.5});
      obs.observe(el);
    });
  }

  /* ── 4. STAGGER OBSERVER — animates children on scroll ─────────── */
  function attachStaggerObserver(root){
    const obs = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('stagger-cards');
          obs.unobserve(entry.target);
        }
      });
    }, {threshold:0.1});
    root.querySelectorAll('[data-stagger]:not([data-stagger-done])').forEach(el => {
      el.setAttribute('data-stagger-done','1');
      obs.observe(el);
    });
  }

  /* ── 5. CARD HOVER LIFT ──────────────────────────────────────── */
  function attachCardHover(root){
    root.querySelectorAll('[data-card]:not([data-card-done])').forEach(el => {
      el.setAttribute('data-card-done','1');
      el.classList.add('card-interactive');
    });
  }

  /* ── 6. INPUT GLOW ─────────────────────────────────────────────── */
  function attachInputGlow(root){
    root.querySelectorAll('input:not([data-glow]),select:not([data-glow])').forEach(el => {
      el.setAttribute('data-glow','1');
    });
  }

  /* ── 7. TAB CONTENT TRANSITION ──────────────────────────────── */
  function animateTabContent(el){
    el.classList.remove('tab-content');
    void el.offsetWidth; // reflow
    el.classList.add('tab-content');
  }
  window.__gnosiAnimateTab = animateTabContent;

  /* ── 8. MUTATION OBSERVER — wire up new DOM elements ──────────── */
  const mo = new MutationObserver(mutations => {
    mutations.forEach(m => {
      m.addedNodes.forEach(node => {
        if(node.nodeType !== 1) return;
        attachRipples(node);
        animateBars(node);
        attachScoreCounters(node);
        attachStaggerObserver(node);
        attachCardHover(node);
        attachInputGlow(node);
        // Animate any newly added fadein elements
        node.querySelectorAll && node.querySelectorAll('.fadein,.panelin,.modalin,.www-panel').forEach(el => {
          el.classList.remove('fadein','panelin','modalin','www-panel');
          void el.offsetWidth;
          el.classList.add(el.getAttribute('data-anim') || 'fadein');
        });
      });
    });
  });
  mo.observe(document.body || document.documentElement, {childList:true, subtree:true});

  /* ── 9. KEYBOARD NAVIGATION HIGHLIGHT ──────────────────────────── */
  document.addEventListener('keydown', e => {
    if(e.key === 'Tab'){
      document.documentElement.classList.add('kb-nav');
    }
  });
  document.addEventListener('mousedown', () => {
    document.documentElement.classList.remove('kb-nav');
  });

  /* ── 10. PAGE LOAD — initial sweep ──────────────────────────────── */
  function init(){
    const root = document.body || document.documentElement;
    attachRipples(root);
    animateBars(root);
    attachScoreCounters(root);
    attachStaggerObserver(root);
    attachCardHover(root);
    attachInputGlow(root);
    // Staggered page-load entry for root app container
    const app = document.getElementById('root');
    if(app){
      app.style.animation = 'fadeIn 400ms cubic-bezier(0.16,1,0.3,1) both';
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }


})();
</script>

/* ═══════════════════════════════════════════════════════════════════
   NOW / HOW / WOW FRAMEWORK PANEL
═══════════════════════════════════════════════════════════════════ */
function NowHowWow({dept,change,slaRules,departments,edges}){
  const[active,setActive]=useState(null);
  const[wowGraph,setWowGraph]=useState(false);
  const relevant=slaRules.filter(r=>r.dept===dept?.name||r.affectedDepts?.includes(dept?.name));
  const gapFlows=(dept?.q3Receives||[]).filter(r=>{
    const hasSLA=slaRules.some(s=>(s.dept===dept?.name||s.affectedDepts?.includes(dept?.name))&&s.report?.toLowerCase().includes((typeof r==="string"?r:r.report||"").toLowerCase().slice(0,6)));
    return !hasSLA;
  });
  const coveredFlows=(dept?.q3Receives||[]).filter(r=>{
    const hasSLA=slaRules.some(s=>(s.dept===dept?.name||s.affectedDepts?.includes(dept?.name))&&s.report?.toLowerCase().includes((typeof r==="string"?r:r.report||"").toLowerCase().slice(0,6)));
    return hasSLA;
  });
  const nowItems=[
    ...(dept?.q1Reports||[]).map(r=>`Generates: ${r}`),
    ...(dept?.q2Shares||[]).map(s=>`Shares with ${s.to||"—"}: ${s.report||s}`),
    ...(dept?.q3Receives||[]).map(r=>`Receives from ${r.from||"—"}: ${r.report||r}`),
  ];
  const howItems=[
    ...gapFlows.slice(0,3).map(r=>`SLA required: ${r.report||r} from ${r.from||"—"} — no formal commitment found`),
    ...relevant.filter(r=>r.severity==="Critical").slice(0,2).map(r=>`Critical rule: ${r.report} — ${r.deadline}`),
    relevant.length===0?"No SLA rules currently constrain this department — full elicitation recommended":null,
  ].filter(Boolean);
  const wowItems=[
    `${(dept?.q2Shares||[]).length} outbound flows fully covered — all downstream units receive on schedule`,
    `${(dept?.q3Receives||[]).length} inbound flows governed — no undocumented dependencies`,
    `Adoption target: ${Math.min(100,(dept?.adoptionScore||0)+15)}% — achievable by resolving ${gapFlows.length} open GAPs`,
    `${dept?.dependents||0} downstream departments unblocked — cascade improvement unlocks ROI milestone`,
  ];
  const WowGraph=()=>{
    const ds=departments||[];
    const n=ds.length;
    if(n===0)return null;
    const cx=280,cy=155,R=130;
    return(
      <div className="fadein" style={{marginTop:12,background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:12,padding:12}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div style={{fontSize:12,fontWeight:500,color:"#15803d"}}>Future state — all GAPs resolved</div>
          <button onClick={()=>setWowGraph(false)} style={{fontSize:11,color:"#6b7280",background:"none",border:"none",cursor:"pointer"}}>✕ Close</button>
        </div>
        <svg viewBox="0 0 560 320" width="100%" style={{display:"block",borderRadius:8}}>
          <defs><marker id="arr-wow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M2 2L8 5L2 8" fill="none" stroke="#22c55e" strokeWidth="1.5" strokeLinecap="round"/></marker></defs>
          {ds.map((d,i)=>{
            const a=(2*Math.PI*i/n)-Math.PI/2;
            const x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
            const isFocus=d.id===dept?.id;
            const col=isFocus?"#15803d":"#22c55e";
            return(<g key={d.id}>
              <circle cx={x} cy={y} r={isFocus?22:16} fill={isFocus?"#dcfce7":"#f0fdf4"} stroke={col} strokeWidth={isFocus?2.5:1.5}/>
              <text x={x} y={y-1} textAnchor="middle" dominantBaseline="central" fontSize={8} fontWeight="600" fill={col}>{d.name.slice(0,3).toUpperCase()}</text>
              <text x={x} y={y+(isFocus?28:22)} textAnchor="middle" fontSize={9} fill="#374151">{d.name.length>10?d.name.slice(0,9)+"…":d.name}</text>
            </g>);
          })}
          {(edges||[]).map((e,i)=>{
            const fi=ds.findIndex(d=>d.id===e.from);
            const ti=ds.findIndex(d=>d.id===e.to);
            if(fi<0||ti<0)return null;
            const fa=(2*Math.PI*fi/n)-Math.PI/2,ta=(2*Math.PI*ti/n)-Math.PI/2;
            const fx=cx+R*Math.cos(fa),fy=cy+R*Math.sin(fa),tx=cx+R*Math.cos(ta),ty=cy+R*Math.sin(ta);
            const dx=tx-fx,dy=ty-fy,len=Math.sqrt(dx*dx+dy*dy);
            if(len<1)return null;
            const nr=18;
            return<line key={i} x1={fx+(dx/len)*nr} y1={fy+(dy/len)*nr} x2={tx-(dx/len)*nr} y2={ty-(dy/len)*nr} stroke="#22c55e" strokeWidth="1.5" opacity="0.7" markerEnd="url(#arr-wow)"/>;
          })}
        </svg>
        <div style={{fontSize:10,color:"#15803d",textAlign:"center",marginTop:6}}>All information flows governed · zero undocumented dependencies · full SLA coverage</div>
      </div>
    );
  };
  const blocks=[
    {key:"now",label:"NOW",sub:"Current operational state",color:"#1d4ed8",bg:"#eff6ff",
     content:`Adoption ${dept?.adoptionScore||0}% · SLA ${dept?.slaScore||0}% · ${dept?.dependents||0} downstream units · ${gapFlows.length} undocumented flows`,
     items:nowItems.slice(0,5),action:null},
    {key:"how",label:"HOW",sub:"Configuration requirements",color:"#7c3aed",bg:"#f3e8ff",
     content:`${gapFlows.length} GAPs need SLA creation · ${relevant.filter(r=>r.severity==="Critical").length} critical rules · ${coveredFlows.length} flows already governed`,
     items:howItems,action:null},
    {key:"wow",label:"WOW",sub:"Future state target",color:"#15803d",bg:"#f0fdf4",
     content:`All ${(dept?.q3Receives||[]).length} inbound + ${(dept?.q2Shares||[]).length} outbound flows formally governed · target ${Math.min(100,(dept?.adoptionScore||0)+15)}%`,
     items:wowItems,action:{label:"View future-state graph",fn:()=>setWowGraph(v=>!v)}},
  ];
  return(
    <div style={{marginBottom:16}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:8}}>
        {blocks.map(b=>(
          <div key={b.key} onClick={()=>setActive(active===b.key?null:b.key)}
            style={{background:b.bg,border:`2px solid ${active===b.key?b.color:b.color+"33"}`,borderRadius:12,padding:"12px 14px",cursor:"pointer",
              transition:"all 240ms cubic-bezier(0.16,1,0.3,1)",transform:active===b.key?"translateY(-2px)":"none",
              boxShadow:active===b.key?`0 4px 16px ${b.color}22`:"none"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <div style={{width:32,height:32,borderRadius:8,background:b.color,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <span style={{color:"#fff",fontWeight:700,fontSize:12}}>{b.label}</span>
              </div>
              <div>
                <div style={{fontWeight:600,fontSize:13,color:b.color}}>{b.label}</div>
                <div style={{fontSize:10,color:"#6b7280"}}>{b.sub}</div>
              </div>
              <div style={{marginLeft:"auto",fontSize:16,color:b.color,transition:"transform 200ms ease",transform:active===b.key?"rotate(180deg)":"none"}}>⌄</div>
            </div>
            <div style={{fontSize:11,color:"#374151",lineHeight:1.5}}>{b.content}</div>
          </div>
        ))}
      </div>
      {active&&(()=>{
        const b=blocks.find(x=>x.key===active);
        if(!b)return null;
        return(
          <div className="fadein" style={{background:b.bg,border:`1px solid ${b.color}44`,borderRadius:12,padding:"14px 16px"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <div style={{fontWeight:600,fontSize:13,color:b.color}}>{b.label} — {b.sub}</div>
              {b.action&&<button onClick={b.action.fn} style={{fontSize:11,padding:"4px 10px",borderRadius:20,border:`1px solid ${b.color}`,background:"#fff",color:b.color,cursor:"pointer",fontWeight:500}}>{b.action.label}</button>}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {b.items.map((item,i)=>(
                <div key={i} style={{display:"flex",gap:8,padding:"6px 10px",background:"#fff",borderRadius:8,border:`1px solid ${b.color}22`}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:b.color,flexShrink:0,marginTop:5}}/>
                  <div style={{fontSize:12,color:"#374151",lineHeight:1.5}}>{item}</div>
                </div>
              ))}
            </div>
            {active==="wow"&&wowGraph&&<WowGraph/>}
          </div>
        );
      })()}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   3CQ GAP ANALYSIS PANEL
═══════════════════════════════════════════════════════════════════ */
function GapPanel({dept,slaRules,anomalies}){
  const deptAnomalies=(anomalies||[]).filter(a=>a.dept===dept?.name);
  const deptSLAs=(slaRules||[]).filter(r=>r.dept===dept?.name||r.affectedDepts?.includes(dept?.name));
  const gaps=[
    {q:"Q1 — Expected Impact & Compliance",icon:"1",
     question:"Does any SLA or Policy provision impede the change?",
     status:deptSLAs.filter(r=>r.severity==="Critical").length>0?"Critical gap":"Review required",
     sevColor:deptSLAs.filter(r=>r.severity==="Critical").length>0?"#b91c1c":"#b45309",
     sevBg:deptSLAs.filter(r=>r.severity==="Critical").length>0?"#fee2e2":"#fef3c7",
     findings:deptSLAs.length>0?deptSLAs.map(r=>`${r.severity} — ${r.type||"SLA"}: ${r.report} constrains this change`):["No SLA/Policy constraints identified for this department"],
    },
    {q:"Q2 — Inter-departmental Impact",icon:"2",
     question:"How does the requesting unit affect other departments?",
     status:dept?.criticality==="Critical"?"High cascading risk":dept?.criticality==="High"?"Moderate risk":"Low risk",
     sevColor:dept?.criticality==="Critical"?"#b91c1c":dept?.criticality==="High"?"#b45309":"#15803d",
     sevBg:dept?.criticality==="Critical"?"#fee2e2":dept?.criticality==="High"?"#fef3c7":"#f0fdf4",
     findings:(dept?.q2Shares||[]).length>0?(dept.q2Shares||[]).map(s=>`Shares "${typeof s==="string"?s:s.report}" with ${typeof s==="string"?"linked unit":s.to} — downstream dependency`):["No outward information flows mapped — complete Q2 to identify impact"],
    },
    {q:"Q3 — Production Impact",icon:"3",
     question:"What is the effect on production operations?",
     status:deptAnomalies.length>0?`${deptAnomalies.length} active anomalies`:"No active anomalies",
     sevColor:deptAnomalies.length>0?"#b45309":"#15803d",
     sevBg:deptAnomalies.length>0?"#fef3c7":"#f0fdf4",
     findings:deptAnomalies.length>0?deptAnomalies.map(a=>`${a.severity} — ${a.type?.replace(/_/g," ")}: ${a.description?.slice(0,80)}...`):["No production anomalies detected for this department"],
    },
  ];
  return(
    <div className="fadein tab-content">
      {gaps.map((g,i)=>(
        <Card key={i} s={{marginBottom:10,borderLeft:`3px solid ${g.sevColor}`}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:6}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:22,height:22,borderRadius:"50%",background:"#5B3FD4",color:"#fff",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{g.icon}</div>
              <div>
                <div style={{fontWeight:500,fontSize:13}}>{g.q}</div>
                <div style={{fontSize:11,color:"#6b7280",fontStyle:"italic"}}>{g.question}</div>
              </div>
            </div>
            <Bdg c={g.status} s={{background:g.sevBg,color:g.sevColor}}/>
          </div>
          {g.findings.map((f,j)=><div key={j} style={{display:"flex",gap:8,padding:"5px 0",borderTop:j>0?"1px solid #f3f4f6":"none"}}><div style={{width:6,height:6,borderRadius:"50%",background:g.sevColor,flexShrink:0,marginTop:5}}/><div style={{fontSize:12,color:"#374151"}}>{f}</div></div>)}
        </Card>
      ))}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════

function CQRow({rows,onChange,depts,allReports,qNum,accent,accentBg}){

    <div style={{marginBottom:14}}>
      {rows.length>0&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1.4fr 24px",gap:5,marginBottom:4}}>

        </div>

        <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1.4fr 24px",gap:5,marginBottom:5,alignItems:"center"}}>
          <select value={row.dept} onChange={e=>upd(i,"dept",e.target.value)} style={{border:"1px solid #d1d5db",borderRadius:7,padding:"6px 8px",fontSize:12,background:"#fff"}}>
            <option value="">Select dept...</option>
            {depts.map(d=><option key={d.id} value={d.name}>{d.name}</option>)}
          </select>
          {row.report==="__custom__"
            ?<input value={row.customReport||""} onChange={e=>upd(i,"customReport",e.target.value)} placeholder="Type report name..." style={{border:"1px solid #7c3aed",borderRadius:7,padding:"6px 8px",fontSize:12}}/>
            :<select value={row.report} onChange={e=>upd(i,"report",e.target.value)} style={{border:"1px solid #d1d5db",borderRadius:7,padding:"6px 8px",fontSize:12,background:"#fff"}}>
              <option value="">Select report...</option>
              {allReports.map(r=><option key={r} value={r}>{r}</option>)}
              <option value="__custom__">+ Add new report name</option>
            </select>

          <input value={row.explanation} onChange={e=>upd(i,"explanation",e.target.value)} placeholder="Purpose, context, frequency..." style={{border:"1px solid #d1d5db",borderRadius:7,padding:"6px 8px",fontSize:12}}/>
          <button onClick={()=>del(i)} style={{width:22,height:22,borderRadius:"50%",border:"1px solid #e5e7eb",background:"#fff",cursor:"pointer",fontSize:13,color:"#9ca3af",padding:0}}>×</button>
        </div>

      <button onClick={add} style={{fontSize:12,color:accent,background:accentBg,border:`1px solid ${accent}33`,borderRadius:20,padding:"4px 12px",cursor:"pointer",fontWeight:500}}>+ Add row</button>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   DEPENDENCY GRAPH — colour-coded arrows, clickable
═══════════════════════════════════════════════════════════════════ */
function DepGraph({departments,edges,onSelectDept,selectedDept,onSelectEdge}){
  const W=620,H=420,cx=W/2,cy=(H-20)/2,R=158;
  const[hovered,setHovered]=useState(null);
  const n=departments.length;
  const positions=departments.map((d,i)=>{
    const a=(2*Math.PI*i/n)-Math.PI/2;
    return{x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),dept:d};
  });
  const posMap={};positions.forEach(p=>{posMap[p.dept.id]=p;});
  const critCol=d=>{if(d==="Critical")return"#ef4444";if(d==="High")return"#f59e0b";if(d==="Medium")return"#3b82f6";return"#9ca3af";};
  const getEdgeColor=(e)=>e.type?arrowC[e.type]||"#9ca3af":"#9ca3af";
  const focusId=selectedDept?.id||hovered;
  const connectedIds=React.useMemo(()=>{
    if(!focusId)return new Set();
    const s=new Set([focusId]);
    (edges||[]).forEach(e=>{if(e.from===focusId)s.add(e.to);if(e.to===focusId)s.add(e.from);});
    return s;
  },[focusId,edges]);
  const edgeActive=(e)=>!focusId||(e.from===focusId||e.to===focusId);
  const nodeActive=(id)=>!focusId||connectedIds.has(id);
  const textCol="#374151";
  return(
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:"block",borderRadius:12}}>
      <defs>
        {Object.entries(arrowC).map(([k,col])=>(
          <marker key={k} id={`arr-${k}`} viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M2 2L8 5L2 8" fill="none" stroke={col} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </marker>
        ))}
        <marker id="arr-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M2 2L8 5L2 8" fill="none" stroke="#9ca3af" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </marker>
        <filter id="glow-node" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="glow-edge" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>
      {(edges||[]).map((e,i)=>{
        const f=posMap[e.from],t=posMap[e.to];
        if(!f||!t)return null;
        const dx=t.x-f.x,dy=t.y-f.y,len=Math.sqrt(dx*dx+dy*dy);
        if(len<1)return null;
        const nr=26;
        const sx=f.x+(dx/len)*nr,sy=f.y+(dy/len)*nr,ex=t.x-(dx/len)*nr,ey=t.y-(dy/len)*nr;
        const ec=getEdgeColor(e);
        const active=edgeActive(e);
        const isHighlit=!!(focusId&&(e.from===focusId||e.to===focusId));
        const isInbound=!!(focusId&&e.to===focusId);
        const isOutbound=!!(focusId&&e.from===focusId);
        const markerId=e.type?`arr-${e.type}`:"arr-default";
        const pathLen=Math.round(len);
        const dashAnim=isHighlit?(isOutbound?`dashFlow ${pathLen*5}ms linear infinite`:`dashFlow ${pathLen*8}ms linear infinite reverse`):"none";
        return(
          <g key={i} onClick={()=>onSelectEdge&&onSelectEdge(e)} style={{cursor:"pointer"}}>
            {isHighlit&&<line x1={sx} y1={sy} x2={ex} y2={ey} stroke={ec} strokeWidth="6" opacity="0.14" filter="url(#glow-edge)"/>}
            <line x1={sx} y1={sy} x2={ex} y2={ey}
              stroke={ec} strokeWidth={isHighlit?2.5:1.5}
              markerEnd={`url(#${markerId})`}
              opacity={active?isHighlit?1:0.55:0.08}
              strokeDasharray={isHighlit?"8 5":"none"}
              style={{transition:"opacity 380ms cubic-bezier(0.16,1,0.3,1),stroke-width 280ms ease",animation:dashAnim}}
            />
          </g>
        );
      })}
      {positions.map(({x,y,dept})=>{
        const sel=selectedDept&&dept.id===selectedDept.id;
        const hov=hovered===dept.id;
        const active=nodeActive(dept.id);
        const col=critCol(dept.criticality);
        const r=sel?27:hov?24:20;
        return(
          <g key={dept.id}
             onClick={()=>onSelectDept(sel?null:dept)}
             onMouseEnter={()=>setHovered(dept.id)}
             onMouseLeave={()=>setHovered(null)}
             style={{cursor:"pointer",opacity:active?1:0.15,transition:"opacity 380ms cubic-bezier(0.16,1,0.3,1)"}}>
            {sel&&<circle cx={x} cy={y} r={r+8} fill="none" stroke={col} strokeWidth="1" opacity="0.2"/>}
            {sel&&<circle cx={x} cy={y} r={r+4} fill="none" stroke={col} strokeWidth="1.5" opacity="0.35" style={{animation:"glowTeal 2.5s ease-in-out infinite"}}/>}
            {hov&&!sel&&<circle cx={x} cy={y} r={r+5} fill="none" stroke={col} strokeWidth="1" opacity="0.28" style={{animation:"glowPulse 1.8s ease-in-out infinite"}}/>}
            <circle cx={x} cy={y} r={r}
              fill={sel?"#ffffff":hov?col+"30":col+"18"}
              stroke={col} strokeWidth={sel?2.5:hov?2:1.5}
              style={{transition:"r 300ms cubic-bezier(0.34,1.56,0.64,1),fill 220ms ease,stroke-width 220ms ease",filter:sel?"url(#glow-node)":"none"}}
            />
            <text x={x} y={y-1} textAnchor="middle" dominantBaseline="central"
              fontSize={sel?10:9} fontWeight="600" fill={col}
              style={{transition:"font-size 220ms ease",pointerEvents:"none"}}>
              {dept.name.slice(0,3).toUpperCase()}
            </text>
            <text x={x} y={y+(r+11)} textAnchor="middle"
              fontSize={sel?11:10} fill={textCol} fontWeight={sel?"600":"400"}
              style={{transition:"all 220ms ease",pointerEvents:"none"}}>
              {dept.name.length>13?dept.name.slice(0,12)+"…":dept.name}
            </text>
            <text x={x} y={y+(r+23)} textAnchor="middle"
              fontSize={9} fill={sc(dept.adoptionScore)} fontWeight={sel?"600":"400"}
              style={{pointerEvents:"none"}}>
              {dept.adoptionScore}%
            </text>
          </g>
        );
      })}
    </svg>
  );
}
function EdgeTable({edge,onClose}){
  if(!edge)return null;
  const ec=getEdgeC(edge);
  return(
    <Card s={{marginBottom:12,borderLeft:`3px solid ${ec}`,position:"relative"}} className="fadein">
      <button onClick={onClose} style={{position:"absolute",top:10,right:12,border:"none",background:"none",cursor:"pointer",fontSize:16,color:"#9ca3af"}}>×</button>
      <div style={{fontWeight:500,fontSize:13,marginBottom:10}}>Information flow: {edge.from} → {edge.to}</div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead>
          <tr>{["Report / Document","Type","Frequency","Recipient action"].map(h=><th key={h} style={{padding:"6px 10px",background:"#f9fafb",border:"1px solid #e5e7eb",textAlign:"left",fontWeight:500,color:"#6b7280",fontSize:11}}>{h}</th>)}</tr>
        </thead>
        <tbody>
          {(edge.infoTypes||[{report:edge.report,type:edge.type||"operational",frequency:"Monthly",action:"Review and act"}]).map((r,i)=>(
            <tr key={i}>{[r.report,r.type||edge.type||"operational",r.frequency||"As required",r.action||"Review and act"].map((v,j)=><td key={j} style={{padding:"6px 10px",border:"1px solid #e5e7eb",color:"#374151",background:i%2===0?"#fff":"#fafafa"}}>{v}</td>)}</tr>
          ))}
        </tbody>
      </table>
    </Card>
  );
}
function getEdgeC(e){return e&&e.type?arrowC[e.type]||"#9ca3af":"#9ca3af";}

/* ═══════════════════════════════════════════════════════════════════

            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   CONSISTENCY ENGINE
═══════════════════════════════════════════════════════════════════ */
function ConsistencyEngine({data}){
  const matches=[];
  const mismatches=[];
  (data.slaRules||[]).forEach(sla=>{
    const relatedAnomaly=(data.anomalies||[]).find(a=>a.dept===sla.dept&&a.type==="sla_deviation");
    if(relatedAnomaly){
      mismatches.push({sla,anomaly:relatedAnomaly,type:"SLA-Anomaly mismatch",severity:"High",description:`SLA "${sla.report}" states ${sla.deadline} but anomaly detection has identified consistent deviation — actual performance does not match the stated SLA.`});
    }else{
      matches.push({sla,status:"Aligned",description:`"${sla.report}" SLA is supported by current operational behaviour.`});
    }
  });
  const conflictPairs=[];
  const slaArr=data.slaRules||[];
  for(let i=0;i<slaArr.length;i++){
    for(let j=i+1;j<slaArr.length;j++){
      if(slaArr[i].affectedDepts?.includes(slaArr[j].dept)||slaArr[j].affectedDepts?.includes(slaArr[i].dept)){
        conflictPairs.push({a:slaArr[i],b:slaArr[j],description:`"${slaArr[i].report}" (${slaArr[i].dept}) and "${slaArr[j].report}" (${slaArr[j].dept}) are in a dependency chain. A change to one deadline may make the other unachievable.`});
      }
    }
  }
  return(
    <div className="fadein">
      <div style={{fontSize:15,fontWeight:500,marginBottom:2}}>Consistency Engine</div>
      <div style={{fontSize:12,color:"#6b7280",marginBottom:14}}>Matching SLAs to SOPs and operational behaviour to identify departmental misalignments</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
        {[{l:"Aligned",v:matches.length,bg:"#f0fdf4",col:"#15803d"},{l:"SLA-Anomaly mismatches",v:mismatches.length,bg:"#fef2f2",col:"#b91c1c"},{l:"Dependency conflicts",v:conflictPairs.length,bg:"#fef3c7",col:"#b45309"}].map((c,i)=>(
          <div key={i} style={{background:c.bg,borderRadius:10,padding:"10px 14px",textAlign:"center"}}>
            <div style={{fontSize:22,fontWeight:500,color:c.col}}>{c.v}</div>
            <div style={{fontSize:11,color:c.col,fontWeight:500}}>{c.l}</div>
          </div>
        ))}
      </div>
      {mismatches.length>0&&(
        <div style={{marginBottom:14}}>
          <Lbl c="SLA-to-SOP mismatches detected"/>
          {mismatches.map((m,i)=>(
            <Card key={i} s={{marginBottom:8,borderLeft:"3px solid #b91c1c"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontWeight:500,fontSize:13}}>{m.sla.dept} — {m.sla.report}</span>
                <Bdg c={m.type} s={{background:"#fee2e2",color:"#b91c1c"}}/>
              </div>
              <div style={{fontSize:12,color:"#6b7280",marginBottom:6}}>{m.description}</div>
              <div style={{background:"#f9fafb",borderRadius:7,padding:"7px 9px",fontSize:11,color:"#374151"}}><span style={{fontWeight:500}}>Anomaly evidence:</span> {m.anomaly.description}</div>
            </Card>
          ))}
        </div>
      )}
      {conflictPairs.length>0&&(
        <div style={{marginBottom:14}}>
          <Lbl c="Dependency chain conflicts — SLA cascade risks"/>
          {conflictPairs.map((p,i)=>(
            <Card key={i} s={{marginBottom:8,borderLeft:"3px solid #b45309"}}>
              <div style={{fontWeight:500,fontSize:13,marginBottom:4}}>{p.a.dept} ↔ {p.b.dept}</div>
              <div style={{fontSize:12,color:"#6b7280"}}>{p.description}</div>
            </Card>
          ))}
        </div>
      )}
      {matches.length>0&&(
        <div>
          <Lbl c="Aligned SLA-SOP pairs"/>
          <Card>{matches.map((m,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:i<matches.length-1?"1px solid #f3f4f6":"none"}}>
              <div style={{width:7,height:7,borderRadius:"50%",background:"#15803d",flexShrink:0}}/>
              <div style={{flex:1,fontSize:12}}>{m.sla.dept} — {m.sla.report}</div>
              <Bdg c="Aligned" s={{background:"#f0fdf4",color:"#15803d"}}/>
            </div>
          ))}</Card>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   SUMMARY OF FINDINGS — automated report
═══════════════════════════════════════════════════════════════════ */
function SummaryOfFindings({data,reviews,updates,industry,erp,country}){
  const depts=data.departments||[];
  const avg=k=>Math.round(depts.reduce((s,d)=>s+d[k],0)/depts.length);
  const critCount=depts.filter(d=>d.criticality==="Critical").length;
  const conflicts=updates.filter(u=>u.severity==="Conflict");
  const critAnoms=(data.anomalies||[]).filter(a=>a.severity==="Critical");

  const findings=[
    {cat:"Adoption",status:avg("adoptionScore")>=75?"On track":"At risk",score:avg("adoptionScore"),detail:`Average adoption ${avg("adoptionScore")}% across ${depts.length} departments. ${critCount} departments rated Critical — their underperformance cascades to ${depts.filter(d=>d.criticality==="Critical").reduce((s,d)=>s+d.dependents,0)} downstream units.`,color:avg("adoptionScore")>=75?"#15803d":"#b91c1c"},
    {cat:"SLA compliance",status:avg("slaScore")>=75?"Compliant":"Underperforming",score:avg("slaScore"),detail:`Average SLA compliance ${avg("slaScore")}% across all departments. ${(data.slaRules||[]).filter(r=>r.severity==="Critical").length} Critical SLA rules in effect.`,color:avg("slaScore")>=75?"#15803d":"#b91c1c"},
    {cat:"Conflict alerts",status:conflicts.length>0?"Active conflicts":"No conflicts",score:conflicts.length===0?100:Math.max(20,100-conflicts.length*25),detail:`${conflicts.length} active policy/SLA conflicts detected. ${conflicts.length>0?"Immediate resolution required — downstream departments have been notified.":"All SLA and policy rules are in harmony."}`,color:conflicts.length===0?"#15803d":"#7c3aed"},
    {cat:"Critical anomalies",status:critAnoms.length>0?"Immediate action":"Stable",score:critAnoms.length===0?100:Math.max(30,100-critAnoms.length*20),detail:`${critAnoms.length} Critical anomalies detected. ${critAnoms.map(a=>a.dept+" ("+a.type?.replace(/_/g," ")+")").join("; ")}.`,color:critAnoms.length===0?"#15803d":"#b91c1c"},
    {cat:"ERP fit",status:reviews?"Data available":"No data",score:reviews?.overallRating?Math.round(reviews.overallRating/5*100):50,detail:reviews?`${erp} rated ${reviews.overallRating}/5.0 from ${reviews.totalReviews?.toLocaleString()} public reviews. Top complaint: "${reviews.topComplaints?.[0]||"N/A"}".`:"OEM review data not available for this session.",color:reviews?.overallRating>=4?"#15803d":reviews?.overallRating>=3?"#b45309":"#b91c1c"},
  ];

  const overallScore=Math.round(findings.reduce((s,f)=>s+f.score,0)/findings.length);

  return(
    <div className="fadein">
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14}}>
        <div>
          <div style={{fontSize:16,fontWeight:500,marginBottom:2}}>Summary of Findings</div>
          <div style={{fontSize:12,color:"#6b7280"}}>{data.companyName} · {erp} · {industry} · {country} · Generated {new Date().toLocaleDateString()}</div>
        </div>
        <div style={{textAlign:"center",background:"#EDE9FF",border:"1px solid #5B3FD4",borderRadius:12,padding:"10px 20px"}}>
          <div style={{fontSize:28,fontWeight:600,color:"#5B3FD4"}}>{overallScore}</div>
          <div style={{fontSize:10,color:"#6b7280",fontWeight:500}}>OVERALL SCORE</div>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:16}}>
        {findings.map((f,i)=>(
          <div key={i} style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:10,padding:"10px 12px",textAlign:"center"}}>
            <div style={{fontSize:18,fontWeight:600,color:f.color}}>{f.score}</div>
            <div style={{fontSize:10,fontWeight:500,color:"#6b7280",textTransform:"uppercase",letterSpacing:".03em"}}>{f.cat}</div>
            <Bdg c={f.status} s={{background:f.color==="#15803d"?"#f0fdf4":f.color==="#b91c1c"?"#fee2e2":"#fdf2ff",color:f.color,marginTop:4}}/>
          </div>
        ))}
      </div>

      <div style={{marginBottom:16}}>
        <Lbl c="Detailed findings"/>
        {findings.map((f,i)=>(
          <div key={i} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 0",borderBottom:"1px solid #f3f4f6"}}>
            <div style={{width:40,height:40,borderRadius:8,background:f.color==="#15803d"?"#f0fdf4":f.color==="#b91c1c"?"#fee2e2":f.color==="b45309"?"#fef3c7":"#fdf2ff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <span style={{fontSize:14,fontWeight:600,color:f.color}}>{f.score}</span>
            </div>
            <div>
              <div style={{fontWeight:500,fontSize:13,marginBottom:2}}>{f.cat} — {f.status}</div>
              <div style={{fontSize:12,color:"#6b7280",lineHeight:1.5}}>{f.detail}</div>
            </div>
          </div>
        ))}
      </div>

      {(data.anomalies||[]).length>0&&(
        <div style={{marginBottom:14}}>
          <Lbl c="Priority actions required"/>
          {(data.anomalies||[]).sort((a,b)=>a.severity==="Critical"?-1:1).slice(0,4).map((a,i)=>(
            <div key={i} style={{display:"flex",gap:8,padding:"8px 0",borderBottom:"1px solid #f3f4f6",alignItems:"flex-start"}}>
              <Bdg c={`${i+1}`} s={{background:"#5B3FD4",color:"#fff",borderRadius:"50%",padding:"1px 7px",flexShrink:0}}/>
              <div><div style={{fontWeight:500,fontSize:12,marginBottom:2}}>{a.dept}: {a.type?.replace(/_/g," ")}</div><div style={{fontSize:11,color:"#6b7280"}}>{a.hypothesis}</div></div>
              <Bdg c={a.severity} s={sevC(a.severity)}/>
            </div>
          ))}
        </div>
      )}

      <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,padding:"12px 14px",fontSize:11,color:"#78350f"}}>
        <span style={{fontWeight:500}}>Report generated by Gnósi-Enórasi</span> — This summary reflects live platform data as of {new Date().toLocaleString()}. For full technical detail, review the Consultant Portal anomaly analysis and SOP Compliance tabs. Share this summary with stakeholders via the consultant-led briefing process.
      </div>
    </div>
  );
}

function AuthScreen({onAuth}){
  const[mode,setMode]=useState("signin");
  const[email,setEmail]=useState("");
  const[pass,setPass]=useState("");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const submit=async()=>{
    if(!email.trim()||!pass.trim()){setErr("Please enter your email and password.");return;}
    setLoading(true);setErr("");
    try{
      let res;
      if(mode==="signup"){
        res=await sb.auth.signUp({email:email.trim(),password:pass});
        if(res.error)throw res.error;
        if(res.data?.user&&!res.data?.session){
          setErr("Check your email and click the confirmation link, then sign in.");
          setLoading(false);return;
        }
      }else{
        res=await sb.auth.signInWithPassword({email:email.trim(),password:pass});
        if(res.error)throw res.error;
      }
      onAuth(res.data.session);
    }catch(e){
      setErr(e.message||"Authentication failed. Please try again.");
    }finally{setLoading(false);}
  };
  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#f0eeff,#f9fafb)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:400}}>
        <div style={{textAlign:"center",marginBottom:28}}><Logo h={52}/><div style={{fontSize:13,color:"#6b7280",marginTop:8}}>AI-Driven Implementation Assurance Platform</div></div>
        <Card s={{padding:24}}>
          <div style={{fontSize:15,fontWeight:600,color:"#1f2937",marginBottom:18,textAlign:"center"}}>{mode==="signin"?"Welcome back":"Create your account"}</div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:4}}>Email address</div>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="you@example.com" style={{width:"100%",border:"1px solid #d1d5db",borderRadius:8,padding:"9px 11px",fontSize:13,boxSizing:"border-box"}}/>
          </div>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:4}}>Password</div>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder={mode==="signup"?"Minimum 6 characters":""} style={{width:"100%",border:"1px solid #d1d5db",borderRadius:8,padding:"9px 11px",fontSize:13,boxSizing:"border-box"}}/>
          </div>
          {err&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#991b1b",marginBottom:12}}>{err}</div>}
          <button onClick={submit} disabled={loading} style={{width:"100%",padding:"11px 0",borderRadius:10,border:"none",background:loading?"#e5e7eb":"#5B3FD4",color:loading?"#9ca3af":"#fff",fontSize:13,fontWeight:500,cursor:loading?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6,marginBottom:14}}>
            {loading&&<Spin/>}{loading?"Please wait...":(mode==="signin"?"Sign in":"Create account")}
          </button>
          <div style={{textAlign:"center",fontSize:12,color:"#6b7280"}}>
            {mode==="signin"?"No account yet? ":"Already have an account? "}
            <span onClick={()=>{setMode(mode==="signin"?"signup":"signin");setErr("");}} style={{color:"#5B3FD4",cursor:"pointer",fontWeight:500}}>{mode==="signin"?"Create one":"Sign in"}</span>
          </div>
        </Card>
        <div style={{textAlign:"center",fontSize:11,color:"#9ca3af",marginTop:12}}>Your data is stored securely in the Gnósi platform</div>
      </div>
    </div>
  );
}

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
            <div><div style={{fontSize:12,color:"#6b7280",marginBottom:4}}>Company name</div><input value={companyName} onChange={e=>setCompanyName(e.target.value)} placeholder="e.g. Acme Manufacturing" style={{width:"100%",border:"1px solid #d1d5db",borderRadius:8,padding:"7px 10px",fontSize:12}}/></div>
            <div><div style={{fontSize:12,color:"#6b7280",marginBottom:4}}>ERP system</div><input value={erpName} onChange={e=>setErpName(e.target.value)} placeholder="e.g. SAP S/4HANA" style={{width:"100%",border:"1px solid #d1d5db",borderRadius:8,padding:"7px 10px",fontSize:12}}/></div>
          </div>
          {err&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#991b1b",marginBottom:10}}>{err}</div>}
          {loading&&<div style={{marginBottom:12}}>{logs.map((l,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}><div style={{width:16,height:16,borderRadius:"50%",background:l.done?"#16a34a":"#e5e7eb",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{l.done?<span style={{color:"#fff",fontSize:9}}>✓</span>:i===logs.length-1?<Spin/>:null}</div><span style={{fontSize:12,color:l.done?"#374151":"#9ca3af"}}>{l.m||"Done"}</span></div>)}</div>}
          <div style={{display:"flex",gap:8}}>
            <button onClick={async()=>{
              if(!key.trim()){setErr("Please enter your platform key to enable live analysis.");return;}
              setErr("");setLoading(true);setLogs([]);
              try{
                // ── Step 1: read uploaded files ──────────────────────────
                log("Reading uploaded documents...");
                const readF=f=>new Promise((res,rej)=>{
                  if(!f)return res(null);
                  if(f.type==="application/pdf"||f.name?.endsWith(".pdf")){
                    const r=new FileReader();
                    r.onload=e=>res({type:"pdf",name:f.name,data:e.target.result.split(",")[1]});
                    r.onerror=rej;r.readAsDataURL(f);
                  }else{
                    const r=new FileReader();
                    r.onload=e=>{let t=e.target.result;if(t.length>14000)t=t.slice(0,14000)+"\n[truncated]";res({type:"text",name:f.name,data:t});};
                    r.onerror=rej;r.readAsText(f);
                  }
                });
                const [qd,pd,sd]=await Promise.all([readF(fQ),readF(fP),readF(fS)]);
                if(!qd&&!pd&&!sd){setErr("Please upload at least one document before analysing.");setLoading(false);return;}
                log("",true);

                // ── Step 2: build message content ────────────────────────
                log("Extracting departments and information flows from your documents...");
                const EXTRACT_PROMPT=`You are an ERP implementation intelligence engine. Analyse all provided documents carefully and extract the organisation's real data.

Return ONLY a valid JSON object (no markdown fences, no explanation before or after):
{
  "companyName":"string — extract from documents or use 'Your Organisation'",
  "erpSystem":"string — extract from documents",
  "industry":"string — infer from documents",
  "country":"string — infer from documents or use 'Portugal'",
  "implementationPhase":"string e.g. Day X of Y or Pre-implementation",
  "overallAdoptionScore":68,
  "departments":[{
    "id":"lowercase_no_spaces",
    "name":"Department Name",
    "criticality":"Critical|High|Medium|Low",
    "dependents":5,
    "multiplier":"x1.8",
    "adoptionScore":72,
    "slaScore":75,
    "hasAlert":false,"hasUpdate":false,"hasConflict":false,
    "q1Reports":["report name 1","report name 2"],
    "q2Shares":[{"report":"report name","to":"Department Name"}],
    "q3Receives":[{"report":"report name","from":"Department Name"}]
  }],
  "graphEdges":[{"from":"dept_id","to":"dept_id","report":"report name","type":"financial|operational|compliance|hr|regulatory|data"}],
  "slaRules":[{"id":"sla1","dept":"Department Name","report":"report name","deadline":"description","severity":"Critical|High|Medium","affectedDepts":["Dept"],"current":true,"type":"SLA|Policy"}],
  "conflictScenarios":[],
  "policyHighlights":["policy point 1","policy point 2"],
  "anomalies":[{"id":"an1","dept":"Department Name","type":"workflow_bypass|adoption_gap|sla_deviation|config_mismatch","severity":"Critical|High|Medium","description":"what is happening","hypothesis":"recommended fix","affectedDepts":["Dept"]}]
}

CRITICAL RULES:
- Extract REAL data from the documents — do NOT use fictional company names or generic data
- Assign criticality by Q2 recipient count: 6+ = Critical x2.4 · 4-5 = High x1.8 · 2-3 = Medium x1.4 · 0-1 = Low x0.8
- If a document is a 3CQ elicitation response, extract every Q1/Q2/Q3 item per department
- If a document is an SLA document, extract every rule with its department, deadline, and severity
- If a document is a policy document, extract the key policy highlights as an array of strings
- Extract anomalies where the documents reveal gaps between commitments and practice
- conflictScenarios should be empty array unless you identify a direct contradiction between two rules
- Return valid JSON only — no markdown, no preamble, no explanation`;

                const parts=[{type:"text",text:EXTRACT_PROMPT}];
                if(companyName)parts.push({type:"text",text:`\nCompany name: "${companyName}"`});
                if(erpName)parts.push({type:"text",text:`ERP system: "${erpName}"`});
                if(qd){parts.push({type:"text",text:`\n=== THREE CARDINAL QUESTIONS DOCUMENT (${qd.name}) ===`});if(qd.type==="pdf")parts.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:qd.data}});else parts.push({type:"text",text:qd.data});}
                if(pd){parts.push({type:"text",text:`\n=== COMPANY POLICY DOCUMENT (${pd.name}) ===`});if(pd.type==="pdf")parts.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:pd.data}});else parts.push({type:"text",text:pd.data});}
                if(sd){parts.push({type:"text",text:`\n=== INTERNAL SLA DOCUMENT (${sd.name}) ===`});if(sd.type==="pdf")parts.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:sd.data}});else parts.push({type:"text",text:sd.data});}

                // ── Step 3: send to intelligence engine ─────────────────
                const r1=await ai(key,[{role:"user",content:parts}]);
                const txt1=(r1.content||[]).find(b=>b.type==="text")?.text||"{}";
                let analysis;
                try{analysis=jx(txt1);}catch(e){throw new Error("Could not parse AI response. Please check your documents are readable text or PDF.");}
                if(companyName&&!analysis.companyName)analysis.companyName=companyName;
                if(erpName&&!analysis.erpSystem)analysis.erpSystem=erpName;
                if(!analysis.conflictScenarios)analysis.conflictScenarios=[];
                if(!analysis.anomalies)analysis.anomalies=[];
                log("",true);

                // ── Step 4: fetch OEM reviews ────────────────────────────
                const erpForReview=analysis.erpSystem||erpName||"SAP";
                log(`Searching public reviews for ${erpForReview}...`);
                let reviews=null;
                try{
                  const REVIEW_PROMPT=`Search Gartner Peer Insights and G2 for user reviews of "${erpForReview}". Return ONLY valid JSON with no markdown:
{"erpSystem":"${erpForReview}","overallRating":4.1,"totalReviews":1200,"ratingBreakdown":{"5star":38,"4star":29,"3star":18,"2star":9,"1star":6},"topPraises":["p1","p2","p3"],"topComplaints":["c1","c2","c3"],"featureRatings":[{"feature":"name","rating":4.1,"reviewCount":500}],"productSignals":["s1","s2"],"sources":["Gartner Peer Insights","G2"]}`;
                  const r2=await ai(key,[{role:"user",content:REVIEW_PROMPT}],[{type:"web_search_20250305",name:"web_search"}]);
                  const txts=(r2.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
                  reviews=jx(txts);
                }catch(_){reviews=null;}
                log("",true);

                // ── Step 5: save to Gnósi platform ──────────────────────
                log("Saving to Gnósi platform...");
                let savedCompanyId=null;
                let deptIdMap={};
                try{
                  const{data:co,error:coErr}=await sb.from("companies").insert({
                    name:analysis.companyName||companyName||"Your Organisation",
                    erp_system:analysis.erpSystem||erpName||"",
                    industry:analysis.industry||"",
                    country:analysis.country||"Portugal",
                    implementation_phase:analysis.implementationPhase||""
                  }).select().single();
                  if(!coErr&&co){
                    savedCompanyId=co.id;
                    if(session?.user?.id){
                      await sb.from("users").update({company_id:co.id}).eq("id",session.user.id);
                    }
                    const deptRows=(analysis.departments||[]).map(d=>({
                      company_id:co.id,
                      name:d.name,
                      criticality:d.criticality||"Medium",
                      adoption_score:d.adoptionScore||0,
                      sla_score:d.slaScore||0,
                      has_alert:!!d.hasAlert
                    }));
                    if(deptRows.length){
                      const{data:savedDepts}=await sb.from("departments").insert(deptRows).select();
                      if(savedDepts){
                        savedDepts.forEach((sd,i)=>{
                          if(analysis.departments[i])deptIdMap[analysis.departments[i].id]=sd.id;
                        });
                        analysis.departments=(analysis.departments||[]).map(d=>({...d,supabaseId:deptIdMap[d.id]||null}));
                      }
                    }
                  }
                }catch(_){}
                log("",true);

                // ── Step 6: complete ─────────────────────────────────────
                log("Building your dashboards...");
                await new Promise(r=>setTimeout(r,400));
                log("",true);
                onReady(analysis,reviews,{country:analysis.country||"Portugal",erp:erpName||"",companyId:savedCompanyId});
              }catch(e){
                setErr(e.message||"Something went wrong. Please check your API key and try again.");
              }finally{setLoading(false);}
            }} disabled={loading} style={{flex:2,padding:"11px 0",borderRadius:10,border:"none",background:loading?"#e5e7eb":"#5B3FD4",color:loading?"#9ca3af":"#fff",fontSize:13,fontWeight:500,cursor:loading?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>{loading&&<Spin/>}{loading?"Processing...":"Analyse documents →"}</button>
            <button onClick={()=>setShowDemo(true)} disabled={loading} style={{flex:1,padding:"11px 0",borderRadius:10,border:"1px solid #d1d5db",background:"#fff",color:"#374151",fontSize:12,cursor:"pointer",fontWeight:500}}>Run demo</button>
          </div>
        </Card>
        <div style={{textAlign:"center",fontSize:11,color:"#9ca3af"}}>Documents processed locally · Analysis saved securely to the Gnósi platform database</div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   MAIN APP
═══════════════════════════════════════════════════════════════════ */
function MainApp({analysis,reviews,meta,onReset,session,onLogout}){
  const[role,setRole]=useState(null);
  const[view,setView]=useState("");
  const[depts,setDepts]=useState(analysis.departments||[]);
  const[updates,setUpdates]=useState([]);
  const[userDept,setUserDept]=useState("");
  const[q1Rows,setQ1Rows]=useState([]);const[q2Rows,setQ2Rows]=useState([]);const[q3Rows,setQ3Rows]=useState([]);
  const[selDept,setSelDept]=useState(null);
  const[selEdge,setSelEdge]=useState(null);
  const[consultTab,setConsultTab]=useState("overview");

  const data={...analysis,departments:depts};
  const allReports=useMemo(()=>{const s=new Set();depts.forEach(d=>{(d.q1Reports||[]).forEach(r=>s.add(r));(d.q2Shares||[]).forEach(x=>s.add(x.report||x));(d.q3Receives||[]).forEach(x=>s.add(x.report||x));});return Array.from(s).sort();},[depts]);

  const pushUpdate=rule=>{
    setUpdates(p=>[...p,{...rule,pushedAt:new Date().toLocaleTimeString()}]);
    setDepts(p=>p.map(d=>{
      const isC=rule.severity==="Conflict";
      if(d.name===rule.dept)return{...d,slaScore:Math.max(30,d.slaScore-12),adoptionScore:Math.max(30,d.adoptionScore-6),hasUpdate:true,hasConflict:d.hasConflict||isC};
      if(rule.affectedDepts?.includes(d.name))return{...d,slaScore:Math.max(40,d.slaScore-6),hasAlert:true,hasConflict:d.hasConflict||isC};
      return d;
    }));
  };

  const submitQ=async()=>{
    if(!userDept)return;
    const toArr=rows=>rows.filter(r=>r.dept&&(r.report||r.customReport)).map(r=>({report:r.customReport||r.report,to:r.dept,from:r.dept}));
    const dept=depts.find(d=>d.id===userDept);
    setDepts(p=>p.map(d=>d.id!==userDept?d:{...d,q1Reports:q1Rows.filter(r=>r.report||r.customReport).map(r=>r.customReport||r.report),q2Shares:toArr(q2Rows),q3Receives:toArr(q3Rows),userSubmitted:true,adoptionScore:Math.min(100,d.adoptionScore+5)}));
    if(dept?.supabaseId&&session?.user?.id){
      try{
        await sb.from("elicitations").upsert({
          dept_id:dept.supabaseId,
          round:"1FQ",
          q1_rows:q1Rows.filter(r=>r.report||r.customReport),
          q2_rows:toArr(q2Rows),
          q3_rows:toArr(q3Rows),
          submitted_by:session.user.id
        },{onConflict:"dept_id,round"});
        await sb.from("departments").update({
          adoption_score:Math.min(100,(dept.adoptionScore||0)+5)
        }).eq("id",dept.supabaseId);
      }catch(_){}
    }
    setView("dash");
  };

  const myUpdates=updates.filter(u=>{const d=depts.find(x=>x.id===userDept);return d&&(u.dept===d.name||u.affectedDepts?.includes(d.name));});

  const accentColor=role==="admin"?"#5B3FD4":role==="consultant"?"#1d4ed8":"#0f766e";
  const accentBg=role==="admin"?"#EDE9FF":role==="consultant"?"#eff6ff":"#f0fdfa";

  if(!role){
    return(
      <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#f0eeff,#f9fafb)",display:"flex",alignItems:"center",justifyContent:"center",padding:20,transition:"background 420ms ease"}}>
        <div style={{width:"100%",maxWidth:520}}>
          <div style={{textAlign:"center",marginBottom:24}}><Logo h={48}/><div style={{fontSize:12,color:"#6b7280",marginTop:6}}>{analysis.companyName} · {analysis.erpSystem} · {analysis.industry} · {analysis.country||meta?.country}</div></div>
          <Card>
            <div style={{fontSize:12,fontWeight:500,color:"#6b7280",textAlign:"center",marginBottom:16}}>Select your role</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {[
                {r:"admin",l:"Admin",d:"Department overview · SLA/SOP simulator · All portals · Dependency graph",c:"#5B3FD4"},
                {r:"consultant",l:"Consultant",d:"SOP compliance · ERP GAP analysis · Consistency engine · BoK updates · Summary of findings",c:"#1d4ed8"},
                {r:"user",l:"User",d:"Three cardinal questions (Now/How/Wow) · GAP analysis · Dashboard · Live alerts",c:"#0f766e"},
              ].map(({r,l,d,c})=>(
                <button key={r} onClick={()=>{setRole(r);setView(r==="admin"?"home":r==="consultant"?"c-home":"u-home");}} style={{width:"100%",padding:"14px 16px",borderRadius:10,border:"1px solid #e5e7eb",background:"#fff",textAlign:"left",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.borderColor=c} onMouseLeave={e=>e.currentTarget.style.borderColor="#e5e7eb"}>
                  <div style={{fontWeight:500,marginBottom:3}}>{l}</div><div style={{fontSize:12,color:"#6b7280"}}>{d}</div>
                </button>
              ))}
            </div>
            <div style={{marginTop:14,padding:"10px 12px",background:"#f9fafb",borderRadius:8,fontSize:11,color:"#9ca3af"}}><span style={{fontWeight:500,color:"#6b7280"}}>Demo tip:</span> Admin pushes a Conflict scenario · Consultant analyses the SOP impact · User sees the alert on their dashboard.</div>
          </Card>
          <div style={{textAlign:"center",marginTop:12}}><button onClick={onReset} style={{fontSize:12,color:"#9ca3af",border:"none",background:"none",cursor:"pointer"}}>← New analysis</button></div>
        </div>
      </div>
    );
  }

  const adminNav=[{id:"overview",label:"Dept overview"},{id:"graph",label:"Dependency graph"},{id:"simulator",label:"SLA / SOP simulator",badge:updates.length},{id:"portal-eu",label:"End-user portal"},{id:"portal-oem",label:"OEM portal"}];
  const consultNav=[{id:"c-home",label:"Dashboard"},{id:"c-overview",label:"Overview"},{id:"c-graph",label:"Dependency Graph"},{id:"c-sop",label:"SOP compliance"},{id:"c-gap",label:"ERP GAP table"},{id:"c-consistency",label:"Consistency engine"},{id:"c-bok",label:"BoK updates"},{id:"c-summary",label:"Summary of findings"},{id:"c-storymap",label:"Story map",badge:0},{id:"c-changes",label:"Change tracker",badge:updates.filter(u=>u.status==="approved_by_admin"&&!u.reason).length},{id:"c-frd",label:"FRD sign-off"}];
  const userNav=[{id:"u-home",label:"Dashboard"},{id:"questions",label:"Three cardinal questions"},{id:"dash",label:"My dashboard"},{id:"alerts",label:"Live alerts",badge:myUpdates.length}];
  const nav=role==="admin"?adminNav:role==="consultant"?consultNav:userNav;

  const avg=k=>Math.round(depts.reduce((s,d)=>s+d[k],0)/depts.length);

  return(
    <div style={{display:"flex",minHeight:"100vh"}}>
      {/* SIDEBAR */}
      <div style={{width:220,background:"#fff",borderRight:"1px solid #e5e7eb",display:"flex",flexDirection:"column",flexShrink:0}}>
        <div style={{padding:"12px 14px",borderBottom:"1px solid #f3f4f6"}}>
          <Logo h={34}/>
          <div style={{fontSize:11,fontWeight:500,color:accentColor,marginTop:4,textTransform:"capitalize"}}>{role}</div>
          <div style={{fontSize:10,color:"#9ca3af",marginTop:1}}>{analysis.companyName}</div>
          <div style={{fontSize:10,color:"#9ca3af"}}>{analysis.erpSystem}</div>
        </div>
        <nav style={{flex:1,padding:"8px 8px 0",overflowY:"auto"}}>
          {nav.map(item=>{
            const active=view===item.id;
            return(
              <button key={item.id} onClick={()=>setView(item.id)} style={{width:"100%",textAlign:"left",padding:"7px 10px",borderRadius:8,fontSize:12,fontWeight:active?500:400,cursor:"pointer",background:active?accentBg:"transparent",color:active?accentColor:"#6b7280",border:"none",marginBottom:2,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <span>{item.label}</span>
                {item.badge>0&&<span style={{fontSize:10,fontWeight:500,background:"#fee2e2",color:"#b91c1c",padding:"1px 6px",borderRadius:20}}>{item.badge}</span>}
              </button>
            );
          })}
        </nav>
        <div style={{padding:"8px 8px 12px",borderTop:"1px solid #f3f4f6"}}>
          {updates.length>0&&<div style={{fontSize:11,color:"#b45309",fontWeight:500,marginBottom:4,paddingLeft:10}}>{updates.length} update{updates.length>1?"s":""} pushed</div>}
          <button onClick={()=>{setRole(null);setView("");}} style={{width:"100%",textAlign:"left",padding:"7px 10px",borderRadius:8,fontSize:12,color:"#9ca3af",background:"transparent",border:"none",cursor:"pointer"}}>Switch role</button>
          <button onClick={onReset} style={{width:"100%",textAlign:"left",padding:"7px 10px",borderRadius:8,fontSize:11,color:"#d1d5db",background:"transparent",border:"none",cursor:"pointer"}}>New analysis</button>
          {session&&<div style={{padding:"4px 10px"}}>
            <div style={{fontSize:10,color:"#d1d5db",marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{session.user?.email}</div>
            <button onClick={onLogout} style={{fontSize:11,color:"#ef4444",background:"none",border:"none",cursor:"pointer",padding:0}}>Sign out</button>
          </div>}
        </div>
      </div>

      {/* CONTENT */}
      <div style={{flex:1,overflowY:"auto",background:"#f4f5f7"}}>

        {/* ADMIN: HOME DASHBOARD */}
        {view==="home"&&<AdminDashboard data={data} updates={updates} depts={depts} onNav={v=>{setView(v);setSelDept(null);setSelEdge(null);}}/>}

        {/* CONSULTANT: HOME DASHBOARD */}
        {view==="c-home"&&<ConsultantDashboard data={data} updates={updates} depts={depts} onNav={v=>{setView(v);setSelDept(null);setSelEdge(null);}}/>}

        {/* USER: HOME DASHBOARD */}
        {view==="u-home"&&<UserDashboardHome data={data} updates={updates} depts={depts} userDept={userDept} onNav={v=>setView(v)}/>}

        {/* ADMIN: FRD */}
        {view==="frd"&&<FRDAcknowledgement analysis={analysis} updates={updates} role="admin"/>}

        {/* CONSULTANT: FRD */}
        {view==="c-frd"&&<FRDAcknowledgement analysis={analysis} updates={updates} role="consultant"/>}

        {/* ADMIN: CHANGE TRACKER */}
        {view==="changes"&&(
          <div style={{padding:20}}>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:16,fontWeight:500}}>Change Tracker</div>
              <div style={{fontSize:12,color:"#6b7280"}}>Review change requests from end users · approve to push to consultant</div>
            </div>
            <ChangeTracker
              changes={updates.map(u=>({...u,changedAt:u.pushedAt||u.submittedAt,status:u.status||"submitted_by_user"}))}
              role="admin"
              onApprove={i=>{setUpdates(prev=>{const u=[...prev];u[i]={...u[i],status:"approved_by_admin",pushedAt:new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})};return u;});}}
              onReject={i=>{setUpdates(prev=>{const u=[...prev];u[i]={...u[i],status:"rejected_by_admin"};return u;});}}
            />
          </div>
        )}

        {/* CONSULTANT: CHANGE TRACKER */}
        {view==="c-changes"&&(
          <div style={{padding:20}}>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:16,fontWeight:500}}>Change Tracker</div>
              <div style={{fontSize:12,color:"#6b7280"}}>Admin-approved changes · annotate with reason codes, BoK references, and stakeholder attribution</div>
            </div>
            <ChangeTracker
              changes={updates.map(u=>({...u,changedAt:u.pushedAt,status:u.status||"approved_by_admin"}))}
              role="consultant"
              onAddNote={(i,annotation)=>{setUpdates(prev=>{const u=[...prev];u[i]={...u[i],...annotation};return u;});}}
            />
          </div>
        )}

                {/* ADMIN: DEPT OVERVIEW */}
        {view==="overview"&&(
          <div style={{padding:20}}>
            <div style={{marginBottom:16}}><div style={{fontSize:16,fontWeight:500}}>{data.companyName} — Department overview</div><div style={{fontSize:12,color:"#6b7280"}}>{data.erpSystem} · {data.industry} · {data.implementationPhase}</div></div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:16}}>
              {[{l:"Adoption",v:data.overallAdoptionScore+"%"},{l:"SLA compliance",v:avg("slaScore")+"%"},{l:"Departments",v:depts.length},{l:"Anomalies",v:data.anomalies?.length||0}].map((c,i)=><Card key={i} s={{}}><div style={{fontSize:10,fontWeight:500,color:"#9ca3af",textTransform:"uppercase",marginBottom:4}}>{c.l}</div><div style={{fontSize:22,fontWeight:500}}>{c.v}</div></Card>)}

              </Card>
            ))}

        )}
      </div>
    </div>
  );
}

/* ── Coverage check helper ─────────────────────────────────────────────────── */
function checkCoverage(report,dept,slaRules,policyHighlights){
  const rLow=(report||"").toLowerCase();
  const dLow=(dept||"").toLowerCase();
  const slaMatch=(slaRules||[]).find(r=>{
    const rMatch=r.report&&rLow.includes(r.report.toLowerCase().slice(0,8));
    const dMatch=r.dept&&(dLow.includes(r.dept.toLowerCase())||r.dept.toLowerCase().includes(dLow.split(" ")[0]));
    const affMatch=(r.affectedDepts||[]).some(a=>a.toLowerCase().includes(dLow.split(" ")[0]));
    return rMatch||(dMatch&&rLow.length>3);
  });
  const polMatch=(policyHighlights||[]).find(p=>p.toLowerCase().includes(rLow.slice(0,8))||p.toLowerCase().includes(dLow.split(" ")[0]));
  if(slaMatch&&polMatch)return{status:"covered",label:"Covered",color:"#15803d",bg:"#f0fdf4",bd:"#bbf7d0",slaRef:slaMatch.report||slaMatch.deadline,polRef:polMatch.slice(0,60)+"..."};
  if(slaMatch||polMatch)return{status:"partial",label:"Partial",color:"#b45309",bg:"#fffbeb",bd:"#fde68a",slaRef:slaMatch?(slaMatch.report||slaMatch.deadline):null,polRef:polMatch?polMatch.slice(0,60)+"...":null};
  return{status:"gap",label:"GAP",color:"#b91c1c",bg:"#fef2f2",bd:"#fecaca",slaRef:null,polRef:null};
}

function CoverageRow({report,dept,slaRules,policyHighlights,qLabel}){
  const cv=checkCoverage(report,dept,slaRules,policyHighlights);
  const[open,setOpen]=useState(false);
  return(

}

              {label:"Q3 — Reports you receive from other departments",items:(footprintDept.q3Receives||[]).map(r=>({report:typeof r==="string"?r:r.report,qType:"Q3",from:typeof r==="string"?"":r.from})),accent:"#0f766e",accentBg:"#f0fdfa"},
