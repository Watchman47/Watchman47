              <div key={qi} style={{marginBottom:12}}>
                <div style={{fontSize:11,fontWeight:500,color:accent,background:accentBg,padding:"5px 10px",borderRadius:6,marginBottom:6}}>{label}</div>
                {items.length===0&&<div style={{fontSize:11,color:"#9ca3af",paddingLeft:10}}>No items recorded — complete your 3CQ submission to populate this section.</div>}
                {items.map((item,i)=>{
                  const cov=checkCoverage(item.report,footprintDept.name,(data.slaRules||slaRules||[]),(data.policyHighlights||policyHighlights||[]));
                  const dotCol=cov.status==="covered"?"#15803d":cov.status==="partial"?"#b45309":"#b91c1c";
                  return(
                    <div key={i} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"6px 0",borderBottom:i<items.length-1?"1px solid #f3f4f6":"none"}}>
                      <div style={{width:7,height:7,borderRadius:"50%",background:dotCol,flexShrink:0,marginTop:5}}/>
                      <div style={{flex:1}}>
                        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                          <span style={{fontSize:12,fontWeight:500,color:"#374151"}}>{item.report}</span>
                          {item.to&&<span style={{fontSize:11,color:"#9ca3af"}}>→ {item.to}</span>}
                          {item.from&&<span style={{fontSize:11,color:"#9ca3af"}}>← {item.from}</span>}
                        </div>
                        <div style={{fontSize:11,color:dotCol,marginTop:2}}>
                          {cov.status==="covered"&&"✓ This flow is covered by your SLA and/or policy"}
                          {cov.status==="partial"&&"⚠ Partial coverage — either SLA or policy reference is missing"}
                          {cov.status==="gap"&&"✗ GAP — This flow has no formal SLA or policy backing in your organisational documents"}
                        </div>
                      </div>
                      <Bdg c={cov.status==="covered"?"Covered":cov.status==="partial"?"Partial":"GAP"} s={{background:cov.status==="covered"?"#f0fdf4":cov.status==="partial"?"#fffbeb":"#fee2e2",color:dotCol,flexShrink:0,fontSize:10}}/>
                    </div>
                  );
                })}
              </div>
            ))}
            <div style={{background:"#f9fafb",borderRadius:8,padding:"8px 10px",fontSize:11,color:"#6b7280",marginTop:4}}>
              <span style={{fontWeight:500,color:"#374151"}}>What to do with gaps:</span> Raise undocumented flows with your line manager or ERP consultant. Each gap represents an informal practice that has no SLA protection — if it fails, there is no formal escalation path.
            </div>
          </div>
        </div>
      )}
      {data.policyHighlights?.length>0&&<div style={{marginTop:14}}><Lbl c="Policy highlights"/><Card>{data.policyHighlights.map((p,i)=><div key={i} style={{display:"flex",gap:8,padding:"7px 0",borderBottom:i<data.policyHighlights.length-1?"1px solid #f3f4f6":"none",fontSize:12,color:"#374151"}}><div style={{width:6,height:6,borderRadius:"50%",background:"#5B3FD4",flexShrink:0,marginTop:5}}/>{p}</div>)}</Card></div>}
    </div>
  );
}

function OEMPortal({reviews,updates}){

  const stars=n=>"★".repeat(Math.round(n||0))+"☆".repeat(5-Math.round(n||0));
  const conflicts=updates.filter(u=>u.severity==="Conflict");
  return(
    <div style={{padding:20,overflowY:"auto"}}>
      <div style={{marginBottom:14}}><div style={{fontSize:16,fontWeight:500}}>OEM vendor portal</div><div style={{fontSize:12,color:"#6b7280"}}>{reviews.erpSystem} · {reviews.sources?.join(", ")} · anonymised</div></div>
      {conflicts.length>0&&<div style={{background:"#fdf2ff",border:"1px solid #d8b4fe",borderRadius:8,padding:"10px 12px",marginBottom:14}}><div style={{fontSize:11,fontWeight:500,color:"#7c3aed",marginBottom:3}}>Conflict pattern detected — product roadmap signal</div><div style={{fontSize:11,color:"#4c1d95"}}>A policy/SLA conflict has been flagged across {conflicts.reduce((s,c)=>s+(c.affectedDepts?.length||0),0)} departments in this deployment. This pattern appears across multiple similar deployments. Consider adding a conflict detection layer to the {reviews.erpSystem} SLA configuration UI.</div></div>}
      <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:11,color:"#78350f",display:"flex",alignItems:"center",gap:8}}><div style={{width:7,height:7,borderRadius:"50%",background:"#16a34a"}}/>Anonymised · no individual client identifiable · Sources: {reviews.sources?.join(", ")}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        <Card s={{}}><div style={{fontSize:10,fontWeight:500,color:"#9ca3af",textTransform:"uppercase",marginBottom:6}}>Overall rating</div><div style={{fontSize:28,fontWeight:500}}>{reviews.overallRating?.toFixed(1)}</div><div style={{color:"#f59e0b",fontSize:14}}>{stars(reviews.overallRating)}</div><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>{reviews.totalReviews?.toLocaleString()} reviews</div></Card>
        <Card s={{}}><div style={{fontSize:10,fontWeight:500,color:"#9ca3af",textTransform:"uppercase",marginBottom:8}}>Rating breakdown</div>{Object.entries(reviews.ratingBreakdown||{}).reverse().map(([k,v])=><div key={k} style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}><span style={{fontSize:10,color:"#6b7280",width:28}}>{k.replace("star","★")}</span><div style={{flex:1,height:5,background:"#f3f4f6",borderRadius:3}}><div style={{width:`${v}%`,height:5,borderRadius:3,background:"#f59e0b"}}/></div><span style={{fontSize:10,color:"#9ca3af",width:24}}>{v}%</span></div>)}</Card>
      </div>
      <Lbl c="Feature ratings"/>
      <Card s={{marginBottom:14}}>{(reviews.featureRatings||[]).map((f,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:i<reviews.featureRatings.length-1?"1px solid #f3f4f6":"none"}}><div style={{width:190,fontSize:12,fontWeight:500,color:"#374151",flexShrink:0}}>{f.feature}</div><div style={{flex:1,height:5,background:"#f3f4f6",borderRadius:3}}><div style={{width:`${(f.rating/5)*100}%`,height:5,borderRadius:3,background:f.rating>=4?"#4ade80":f.rating>=3?"#fbbf24":"#f87171"}}/></div><div style={{fontSize:12,color:"#6b7280",width:28,textAlign:"right"}}>{f.rating?.toFixed(1)}</div></div>)}</Card>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        <div><Lbl c="Top praise"/>{(reviews.topPraises||[]).map((p,i)=><div key={i} style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:"8px 10px",marginBottom:6,fontSize:12,color:"#166534"}}>{p}</div>)}</div>
        <div><Lbl c="Top complaints"/>{(reviews.topComplaints||[]).map((c,i)=><div key={i} style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:"8px 10px",marginBottom:6,fontSize:12,color:"#991b1b"}}>{c}</div>)}</div>
      </div>
      {reviews.productSignals?.length>0&&<><Lbl c="Product roadmap signals"/>{reviews.productSignals.map((s,i)=><Card key={i} s={{marginBottom:8}}><div style={{display:"flex",gap:8}}><div style={{width:6,height:6,borderRadius:"50%",background:"#5B3FD4",flexShrink:0,marginTop:5}}/><div style={{fontSize:12,color:"#374151"}}>{s}</div></div></Card>)}</>}
    </div>
  );
}


/* ═══════════════════════════════════════════════════════════════════
   CHANGE TRACKER — reason codes, BoK ref, stakeholder, comms mode
═══════════════════════════════════════════════════════════════════ */
const REASON_CODES={"RC-01":"Client request","RC-02":"Consultant recommendation","RC-03":"Regulatory update","RC-04":"System constraint","RC-05":"Stakeholder decision","RC-06":"BoK update","RC-07":"Error correction","RC-08":"Scope clarification"};
const COMMS_MODES=["Meeting","Email","Formal letter","Platform notification","Phone call","Workshop"];

function AnnotateChange({onSave,onCancel}){
  const[note,setNote]=useState("");
  const[code,setCode]=useState("RC-01");
  const[mode,setMode]=useState("Meeting");
  const[bok,setBok]=useState("");
  const[stakeholder,setStakeholder]=useState("");
  return(
    <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:8,padding:10,marginTop:6}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <div>
          <div style={{fontSize:10,fontWeight:500,color:"#9ca3af",marginBottom:3}}>Reason code</div>
          <select value={code} onChange={e=>setCode(e.target.value)} style={{width:"100%",fontSize:11,padding:"4px 6px",borderRadius:6,border:"1px solid #d1d5db"}}>
            {Object.entries(REASON_CODES).map(([k,v])=><option key={k} value={k}>{k} — {v}</option>)}
          </select>
        </div>
        <div>
          <div style={{fontSize:10,fontWeight:500,color:"#9ca3af",marginBottom:3}}>Communication mode</div>
          <select value={mode} onChange={e=>setMode(e.target.value)} style={{width:"100%",fontSize:11,padding:"4px 6px",borderRadius:6,border:"1px solid #d1d5db"}}>
            {COMMS_MODES.map(m=><option key={m} value={m}>{m}</option>)}
          </select>
        </div>
      </div>
      <div style={{marginBottom:6}}>
        <div style={{fontSize:10,fontWeight:500,color:"#9ca3af",marginBottom:3}}>Reason / justification</div>
        <textarea value={note} onChange={e=>setNote(e.target.value)} rows={2} placeholder="Why was this change made..." style={{width:"100%",fontSize:11,padding:"5px 8px",borderRadius:6,border:"1px solid #d1d5db",resize:"vertical"}}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <div>
          <div style={{fontSize:10,fontWeight:500,color:"#9ca3af",marginBottom:3}}>BoK reference</div>
          <input value={bok} onChange={e=>setBok(e.target.value)} placeholder="e.g. ITIL V4 — Change Mgmt" style={{width:"100%",fontSize:11,padding:"4px 6px",borderRadius:6,border:"1px solid #d1d5db"}}/>
        </div>
        <div>
          <div style={{fontSize:10,fontWeight:500,color:"#9ca3af",marginBottom:3}}>Stakeholder decision by</div>
          <input value={stakeholder} onChange={e=>setStakeholder(e.target.value)} placeholder="Name / role / date" style={{width:"100%",fontSize:11,padding:"4px 6px",borderRadius:6,border:"1px solid #d1d5db"}}/>
        </div>
      </div>
      <div style={{display:"flex",gap:6}}>
        <button onClick={()=>{if(note.trim()){onSave({reason:note,reasonCode:code,commMode:mode,bokRef:bok,stakeholder});}}} style={{fontSize:11,padding:"4px 14px",borderRadius:20,border:"none",background:"#5B3FD4",color:"#fff",cursor:"pointer",fontWeight:500}}>Save annotation</button>
        <button onClick={onCancel} style={{fontSize:11,padding:"4px 12px",borderRadius:20,border:"1px solid #d1d5db",background:"#fff",cursor:"pointer",color:"#6b7280"}}>Cancel</button>
      </div>
    </div>
  );
}

function ChangeTracker({changes,onAddNote,onApprove,onReject,role}){
  const[expanded,setExpanded]=useState(null);
  const[annotating,setAnnotating]=useState(null);
  const isAdmin=role==="admin";
  const isConsultant=role==="consultant";
  const visibleChanges=isConsultant?changes.filter(ch=>ch.status==="approved_by_admin"):changes;
  if(!visibleChanges||visibleChanges.length===0)return(
    <div style={{textAlign:"center",padding:"24px 16px",color:"#9ca3af",fontSize:12}}>
      {isConsultant?"No update from client/admin":"No changes recorded yet. SLA and policy changes will appear here with full audit trail."}
    </div>
  );
  const sevC=s=>s==="Critical"?"#ef4444":s==="High"?"#f59e0b":"#3b82f6";
  const statusLabel=s=>s==="submitted_by_user"?"Pending admin review":s==="approved_by_admin"?"Approved":s==="rejected_by_admin"?"Rejected":"Logged";
  const statusColor=s=>s==="submitted_by_user"?"#b45309":s==="approved_by_admin"?"#15803d":s==="rejected_by_admin"?"#b91c1c":"#6b7280";
  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:6,marginBottom:8,fontSize:10,fontWeight:600,color:"#9ca3af",padding:"0 12px",textTransform:"uppercase"}}>
        <div>What changed</div><div>When</div><div>Status / Reason</div><div>Impact</div>
      </div>
      {visibleChanges.map((ch,idx)=>{
        const i=changes.indexOf(ch);
        return(
        <div key={i} style={{marginBottom:6,border:`1px solid ${sevC(ch.severity)}44`,borderLeft:`3px solid ${sevC(ch.severity)}`,borderRadius:10,overflow:"hidden"}}>
          <div onClick={()=>setExpanded(expanded===i?null:i)} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:6,padding:"9px 12px",background:"#fff",cursor:"pointer",alignItems:"center"}}>
            <div>
              <div style={{fontSize:12,fontWeight:500,color:"#111827"}}>{ch.report}</div>
              <div style={{fontSize:10,color:"#6b7280"}}>{ch.dept} · {ch.type||"SLA"}</div>
            </div>
            <div style={{fontSize:11,color:"#6b7280"}}>{ch.changedAt||ch.pushedAt||ch.submittedAt||"—"}</div>
            <div>
              <div style={{fontSize:11,fontWeight:500,color:statusColor(ch.status)}}>{statusLabel(ch.status)}</div>
              {ch.reasonCode&&<div style={{fontSize:10,color:"#9ca3af"}}>{REASON_CODES[ch.reasonCode]||ch.reasonCode}</div>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:11,color:"#374151"}}>{ch.affectedDepts?.length||0} dept{ch.affectedDepts?.length!==1?"s":""}</span>
              <span style={{marginLeft:"auto",fontSize:14,color:"#9ca3af",transition:"transform 200ms ease",transform:expanded===i?"rotate(180deg)":"none"}}>⌄</span>
            </div>
          </div>
          {expanded===i&&(
            <div className="fadein" style={{padding:"10px 14px",background:"#f9fafb",borderTop:"1px solid #e5e7eb"}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:8}}>
                <div>
                  <div style={{fontSize:10,fontWeight:600,color:"#9ca3af",marginBottom:3}}>CHANGE DETAIL</div>
                  <div style={{fontSize:12,color:"#374151"}}>{ch.deadline||ch.description||"No detail captured"}</div>
                </div>
                <div>
                  <div style={{fontSize:10,fontWeight:600,color:"#9ca3af",marginBottom:3}}>AFFECTED DEPARTMENTS</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                    {(ch.affectedDepts||[]).map((d,j)=><span key={j} style={{fontSize:10,padding:"2px 7px",borderRadius:20,background:"#eff6ff",color:"#1d4ed8"}}>{d}</span>)}
                  </div>
                </div>
              </div>
              {(ch.commMode||ch.bokRef)&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:8}}>
                {ch.commMode&&<div><div style={{fontSize:10,fontWeight:600,color:"#9ca3af",marginBottom:3}}>COMMUNICATION MODE</div><div style={{fontSize:12,color:"#374151"}}>{ch.commMode}</div></div>}
                {ch.bokRef&&<div><div style={{fontSize:10,fontWeight:600,color:"#9ca3af",marginBottom:3}}>BOK REFERENCE</div><div style={{fontSize:12,color:"#374151"}}>{ch.bokRef}</div></div>}
              </div>}
              {ch.stakeholder&&<div style={{marginBottom:8}}><div style={{fontSize:10,fontWeight:600,color:"#9ca3af",marginBottom:3}}>STAKEHOLDER DECISION</div><div style={{fontSize:12,color:"#374151"}}>{ch.stakeholder}</div></div>}
              {ch.reason&&<div style={{marginBottom:8,padding:"6px 10px",background:"#fffbeb",borderRadius:8,border:"1px solid #fcd34d"}}><div style={{fontSize:10,fontWeight:600,color:"#b45309",marginBottom:2}}>REASON RECORDED</div><div style={{fontSize:12,color:"#374151"}}>{ch.reason}</div></div>}
              {/* Admin review buttons for changes pending approval */}
              {isAdmin&&ch.status==="submitted_by_user"&&onApprove&&onReject&&(
                <div style={{display:"flex",gap:6,marginTop:6}}>
                  <button onClick={()=>onApprove(i)} style={{fontSize:11,padding:"5px 14px",borderRadius:20,border:"none",background:"#15803d",color:"#fff",cursor:"pointer",fontWeight:500}}>Approve and push to consultant</button>
                  <button onClick={()=>onReject(i)} style={{fontSize:11,padding:"5px 14px",borderRadius:20,border:"1px solid #ef4444",background:"#fff",color:"#b91c1c",cursor:"pointer"}}>Reject</button>
                </div>
              )}
              {/* Consultant annotation button */}
              {isConsultant&&!ch.reason&&onAddNote&&annotating!==i&&(
                <button onClick={()=>setAnnotating(i)} style={{fontSize:11,padding:"4px 12px",borderRadius:20,border:"1px solid #5B3FD4",background:"#EDE9FF",color:"#5B3FD4",cursor:"pointer",fontWeight:500,marginTop:6}}>+ Add annotation</button>
              )}
              {isConsultant&&annotating===i&&(
                <AnnotateChange onSave={annotation=>{onAddNote(i,annotation);setAnnotating(null);}} onCancel={()=>setAnnotating(null)}/>
              )}
            </div>
          )}
        </div>);
      })}
    </div>
  );
}


/* ═══════════════════════════════════════════════════════════════════
   FRD ACKNOWLEDGEMENT — two-phase, configurable threshold
═══════════════════════════════════════════════════════════════════ */
function FRDAcknowledgement({analysis,updates,role,threshold:propThreshold=4,onThresholdChange}){
  const[phase,setPhase]=useState(1);
  const[adminAck,setAdminAck]=useState(null);
  const[consultAck,setConsultAck]=useState(null);
  const[nameInput,setNameInput]=useState("");
  const[showThresholdEdit,setShowThresholdEdit]=useState(false);
  const[localThreshold,setLocalThreshold]=useState(propThreshold);
  const depts=analysis?.departments||[];
  const changeCount=updates.length;
  const thresholdReached=changeCount>=localThreshold;
  const now=()=>new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const doAck=who=>{
    if(!nameInput.trim())return;
    const stamp={name:nameInput,role:who,at:now()};
    if(who==="admin")setAdminAck(stamp);
    if(who==="consultant")setConsultAck(stamp);
    setNameInput("");
  };
  const phase1Complete=adminAck&&consultAck;
  React.useEffect(()=>{if(phase1Complete&&phase===1)setPhase(2);},[phase1Complete,phase]);
  return(
    <div style={{padding:20}}>
      <div style={{marginBottom:16,display:"flex",alignItems:"flex-start",justifyContent:"space-between"}}>
        <div>
          <div style={{fontSize:16,fontWeight:500}}>FRD Acknowledgement</div>
          <div style={{fontSize:12,color:"#6b7280"}}>Digital sign-off record — does not replace the formal FRD document</div>
        </div>
        {role==="consultant"&&(
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            {showThresholdEdit?(
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:11,color:"#6b7280"}}>Threshold:</span>
                <input type="number" min={1} max={20} value={localThreshold} onChange={e=>setLocalThreshold(Number(e.target.value))} style={{width:50,fontSize:11,padding:"3px 6px",borderRadius:6,border:"1px solid #d1d5db",textAlign:"center"}}/>
                <button onClick={()=>{if(onThresholdChange)onThresholdChange(localThreshold);setShowThresholdEdit(false);}} style={{fontSize:11,padding:"3px 10px",borderRadius:20,border:"none",background:"#5B3FD4",color:"#fff",cursor:"pointer"}}>Set</button>
                <button onClick={()=>setShowThresholdEdit(false)} style={{fontSize:11,padding:"3px 8px",borderRadius:20,border:"1px solid #d1d5db",background:"#fff",cursor:"pointer",color:"#6b7280"}}>✕</button>
              </div>
            ):(
              <button onClick={()=>setShowThresholdEdit(true)} style={{fontSize:11,padding:"4px 12px",borderRadius:20,border:"1px solid #5B3FD4",background:"#EDE9FF",color:"#5B3FD4",cursor:"pointer",fontWeight:500}}>⚙ Change threshold ({localThreshold})</button>
            )}
          </div>
        )}
      </div>
      <div style={{display:"flex",gap:0,marginBottom:20,borderRadius:10,overflow:"hidden",border:"1px solid #e5e7eb"}}>
        {[{n:1,label:"Phase 1 — Baseline acknowledgement",done:phase1Complete},{n:2,label:"Phase 2 — Change versioning",done:changeCount>0}].map((ph,i)=>(
          <div key={ph.n} onClick={()=>phase1Complete&&setPhase(ph.n)} style={{flex:1,padding:"10px 14px",background:phase===ph.n?"#5B3FD4":"#fff",color:phase===ph.n?"#fff":"#6b7280",cursor:phase1Complete?"pointer":"default",borderRight:i===0?"1px solid #e5e7eb":"none",transition:"all 200ms ease"}}>
            <div style={{fontSize:11,fontWeight:600}}>{ph.label}</div>
            <div style={{fontSize:10,opacity:0.8}}>{ph.done?"✓ Completed":"Pending"}</div>
          </div>
        ))}
      </div>
      {phase===1&&(
        <div className="fadein">
          <div style={{marginBottom:12,padding:"10px 14px",background:"#fffbeb",border:"1px solid #fcd34d",borderRadius:10}}>
            <div style={{fontSize:12,fontWeight:500,color:"#b45309",marginBottom:4}}>Phase 1 — Baseline declaration</div>
            <div style={{fontSize:11,color:"#374151"}}>Both parties acknowledge that all issues and information flows identified below accurately reflect the input of the respective business units into the Three Cardinal Questions elicitation. This acknowledgement triggers the start of the versioned change process.</div>
          </div>
          <div style={{marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:500,color:"#374151",marginBottom:8}}>Elicitation summary — {depts.length} departments elicited</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:6}}>
              {depts.map(d=>(
                <div key={d.id} style={{padding:"8px 10px",border:"1px solid #e5e7eb",borderRadius:8,background:"#f9fafb"}}>
                  <div style={{fontSize:12,fontWeight:500,color:"#111827",marginBottom:2}}>{d.name}</div>
                  <div style={{fontSize:10,color:"#6b7280"}}>{(d.q1Reports||[]).length} Q1 · {(d.q2Shares||[]).length} Q2 · {(d.q3Receives||[]).length} Q3</div>
                  <div style={{fontSize:10,color:sc(d.adoptionScore),marginTop:2}}>Adoption: {d.adoptionScore}%</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            {[{who:"admin",label:"Business / Admin acknowledgement",color:"#1d4ed8",ack:adminAck},{who:"consultant",label:"Consultant acknowledgement",color:"#7c3aed",ack:consultAck}].map(box=>(
              <div key={box.who} style={{padding:14,border:`2px solid ${box.ack?box.color+"66":"#e5e7eb"}`,borderRadius:12,background:box.ack?"#f9fafb":"#fff"}}>
                <div style={{fontSize:12,fontWeight:500,color:box.ack?box.color:"#374151",marginBottom:8}}>{box.label}</div>
                {box.ack?(
                  <div style={{padding:"8px 10px",background:"#f0fdf4",borderRadius:8,border:"1px solid #bbf7d0"}}>
                    <div style={{fontSize:11,color:"#15803d",fontWeight:500}}>✓ Acknowledged</div>
                    <div style={{fontSize:10,color:"#374151",marginTop:2}}>{box.ack.name} · {box.ack.at}</div>
                  </div>
                ):(role===box.who||role==="admin"||role==="consultant")&&(
                  <div>
                    <input value={nameInput} onChange={e=>setNameInput(e.target.value)} placeholder="Enter your full name to acknowledge" style={{width:"100%",fontSize:11,padding:"6px 10px",borderRadius:8,border:"1px solid #d1d5db",marginBottom:6}}/>
                    <button onClick={()=>doAck(box.who)} style={{width:"100%",padding:"6px 0",borderRadius:8,border:"none",background:box.color,color:"#fff",fontSize:11,fontWeight:500,cursor:"pointer"}}>Acknowledge baseline</button>
                  </div>
                )}
              </div>
            ))}
          </div>
          {phase1Complete&&(
            <div style={{padding:"10px 14px",background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:10,marginBottom:12}}>
              <div style={{fontSize:12,fontWeight:500,color:"#15803d"}}>✓ Phase 1 complete — change versioning now active</div>
              <div style={{fontSize:11,color:"#374151",marginTop:2}}>Any changes to SLAs or policies from this point are versioned. Threshold set at {localThreshold} changes before commercial review warning.</div>
            </div>
          )}
        </div>
      )}
      {phase===2&&(
        <div className="fadein">
          <div style={{marginBottom:14,padding:"12px 16px",border:`2px solid ${thresholdReached?"#ef4444":"#e5e7eb"}`,borderRadius:12,background:thresholdReached?"#fef2f2":"#fff"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div>
                <div style={{fontSize:13,fontWeight:500,color:thresholdReached?"#b91c1c":"#374151"}}>Version {changeCount} of {localThreshold} — {thresholdReached?"⚠ Threshold reached":"changes recorded"}</div>
                <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{thresholdReached?"Further changes may attract commercial implications and could affect agreed implementation outcomes. A formal change control review is recommended.":`${localThreshold-changeCount} change${localThreshold-changeCount!==1?"s":""} remaining before commercial review threshold`}</div>
              </div>
              <div style={{fontSize:28,fontWeight:700,color:thresholdReached?"#ef4444":"#5B3FD4"}}>{changeCount}</div>
            </div>
          </div>
          <div style={{marginBottom:8,fontSize:12,fontWeight:500,color:"#374151"}}>Versioned changes — {updates.length} recorded</div>
          <ChangeTracker changes={updates.map(u=>({...u,changedAt:u.pushedAt,status:u.status||"approved_by_admin"}))} role={role} onAddNote={()=>{}}/>
          <div style={{marginTop:16,display:"flex",justifyContent:"flex-end"}}>
            <button onClick={()=>window.print()} style={{padding:"8px 20px",borderRadius:20,border:"1px solid #5B3FD4",background:"#EDE9FF",color:"#5B3FD4",fontSize:12,fontWeight:500,cursor:"pointer"}}>🖨 Print acknowledgement record</button>
          </div>
        </div>
      )}
    </div>
  );
}


/* ═══════════════════════════════════════════════════════════════════

function DashTile({icon,label,value,sub,color,onClick,badge}){
  return(
    <div onClick={onClick} style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:14,padding:"16px 18px",cursor:"pointer",transition:"all 240ms cubic-bezier(0.16,1,0.3,1)",position:"relative",overflow:"hidden"}}
      onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-3px)";e.currentTarget.style.boxShadow=`0 8px 24px ${color}22`;}}
      onMouseLeave={e=>{e.currentTarget.style.transform="none";e.currentTarget.style.boxShadow="none";}}>
      {badge>0&&<div style={{position:"absolute",top:10,right:10,minWidth:18,height:18,padding:"0 5px",borderRadius:9,background:"#ef4444",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:"#fff",fontSize:9,fontWeight:700}}>{badge}</span></div>}
      <div style={{width:36,height:36,borderRadius:10,background:color+"18",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:10,fontSize:18}}>{icon}</div>
      <div style={{fontSize:24,fontWeight:700,color:color,marginBottom:2,lineHeight:1}}>{value}</div>
      <div style={{fontSize:13,fontWeight:500,color:"#111827",marginBottom:3}}>{label}</div>
      <div style={{fontSize:11,color:"#6b7280"}}>{sub}</div>
      <div style={{position:"absolute",bottom:0,left:0,height:3,width:"100%",background:`linear-gradient(90deg,${color},${color}44)`}}/>
    </div>
  );
}

function SLASimulatorView({data,updates,onPush}){
  const[sel,setSel]=useState(null);
  const[pushed,setPushed]=useState(false);
  const already=sc=>updates.some(u=>u.id===sc.id);
  const push=()=>{if(!sel||already(sel))return;onPush(sel);setPushed(true);setTimeout(()=>setPushed(false),3000);};
  const conflicts=data.conflictScenarios||[];
  const regular=data.slaRules||[];
  return(
    <div style={{padding:20}}>
      <div style={{marginBottom:16}}><div style={{fontSize:16,fontWeight:500}}>SLA / SOP & Policy simulator</div><div style={{fontSize:12,color:"#6b7280"}}>Select a rule or conflict scenario · preview impact · push live across all portals</div></div>
      {conflicts.length>0&&<div style={{background:"#fdf2ff",border:"1px solid #d8b4fe",borderRadius:10,padding:"10px 12px",marginBottom:14}}><div style={{fontSize:12,fontWeight:500,color:"#7c3aed",marginBottom:4}}>Conflict scenarios — simulating policy / SLA contradictions between departments</div><div style={{fontSize:11,color:"#6b7280"}}>Push a conflict to see how it propagates across all three portals with differentiated alerts.</div></div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
        <div>
          {conflicts.length>0&&<><Lbl c="Conflict scenarios"/>{conflicts.map(sc=>{const p=already(sc);const is=sel?.id===sc.id;return(<button key={sc.id} onClick={()=>setSel(sc)} style={{width:"100%",textAlign:"left",padding:"12px 14px",borderRadius:10,border:is?"2px solid #7c3aed":"1px solid #d8b4fe",background:is?"#fdf2ff":"#fdf8ff",cursor:"pointer",marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:13,fontWeight:500}}>{sc.dept} — {sc.report}</span><Bdg c="Conflict" s={{background:"#fdf2ff",color:"#7c3aed",border:"1px solid #d8b4fe"}}/></div><div style={{fontSize:11,color:"#7c3aed"}}>{sc.type} · contradicts existing rule</div>{p&&<div style={{fontSize:11,color:"#15803d",fontWeight:500,marginTop:3}}>✓ Pushed</div>}</button>);})}<Lbl c="SLA and policy rules"/></>}
          {regular.map(r=>{const p=already(r);const is=sel?.id===r.id;return(<button key={r.id} onClick={()=>setSel(r)} style={{width:"100%",textAlign:"left",padding:"12px 14px",borderRadius:10,border:is?"1px solid #93c5fd":"1px solid #e5e7eb",background:is?"#eff6ff":"#fff",cursor:"pointer",marginBottom:8,opacity:p&&!is?.6:1}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:13,fontWeight:500}}>{r.dept} — {r.report}</span><div style={{display:"flex",gap:4}}><Bdg c={r.type||"SLA"} s={{background:r.type==="Policy"?"#f3e8ff":"#dbeafe",color:r.type==="Policy"?"#7c3aed":"#1d4ed8"}}/><Bdg c={r.severity} s={sevC(r.severity)}/></div></div><div style={{fontSize:11,color:"#6b7280"}}>{r.deadline}</div>{p&&<div style={{fontSize:11,color:"#15803d",fontWeight:500,marginTop:3}}>✓ Pushed</div>}</button>);})}
          {updates.length>0&&<><Lbl c="Push history"/>{updates.map((u,i)=><div key={i} style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:8,padding:"8px 12px",marginBottom:6,display:"flex",alignItems:"center",justifyContent:"space-between"}}><div><div style={{fontSize:12,fontWeight:500}}>{u.dept} — {u.report}</div><div style={{fontSize:11,color:"#9ca3af"}}>{u.pushedAt}</div></div><Bdg c={u.severity==="Conflict"?"Conflict":u.severity} s={u.severity==="Conflict"?{background:"#fdf2ff",color:"#7c3aed"}:sevC(u.severity)}/></div>)}</>}
        </div>
        <div>
          {sel?(<Card s={{}}>
            <div style={{display:"flex",gap:6,marginBottom:12}}><Bdg c={sel.type||"SLA"} s={{background:sel.type==="Policy"?"#f3e8ff":"#dbeafe",color:sel.type==="Policy"?"#7c3aed":"#1d4ed8"}}/><Bdg c={sel.severity==="Conflict"?"Conflict":sel.severity} s={sel.severity==="Conflict"?{background:"#fdf2ff",color:"#7c3aed"}:sevC(sel.severity)}/></div>
            <div style={{fontWeight:500,marginBottom:4}}>{sel.dept} — {sel.report}</div>
            <div style={{fontSize:13,color:"#6b7280",marginBottom:12}}>{sel.deadline}</div>
            {sel.severity==="Conflict"&&<div style={{background:"#fdf2ff",border:"1px solid #d8b4fe",borderRadius:8,padding:"10px 12px",marginBottom:12}}><div style={{fontSize:10,fontWeight:500,color:"#7c3aed",marginBottom:4}}>Conflict with existing rule</div><div style={{fontSize:12,color:"#4c1d95",marginBottom:6}}>{sel.conflictDescription}</div><div style={{fontSize:11,color:"#6b7280"}}><span style={{fontWeight:500}}>Impact:</span> {sel.conflictImpact}</div></div>}
            {sel.affectedDepts?.length>0&&<div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,padding:"10px 12px",marginBottom:12}}><div style={{fontSize:10,fontWeight:500,color:"#b45309",marginBottom:6}}>Departments affected</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{sel.affectedDepts.map((n,i)=><Bdg key={i} c={n} s={{background:"#fef3c7",color:"#92400e"}}/>)}</div></div>}
            <button onClick={push} disabled={already(sel)} style={{width:"100%",padding:"10px 0",borderRadius:10,border:"none",cursor:already(sel)?"not-allowed":"pointer",background:already(sel)?"#f3f4f6":pushed?"#16a34a":sel.severity==="Conflict"?"#7c3aed":"#5B3FD4",color:already(sel)?"#9ca3af":"#fff",fontSize:13,fontWeight:500,transition:"all 220ms cubic-bezier(0.16,1,0.3,1)"}}>{already(sel)?"Already pushed":pushed?"Pushed successfully":"Push update live →"}</button>
            {pushed&&<div style={{marginTop:10,background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:"10px 12px",fontSize:12,color:"#15803d"}}>Update pushed. Check all three portals and the Consultant SOP Compliance tab for differentiated impact.</div>}
          </Card>):<div style={{background:"#f9fafb",border:"1px dashed #d1d5db",borderRadius:12,padding:40,textAlign:"center"}}><div style={{fontSize:13,color:"#9ca3af"}}>Select a rule on the left to preview and push it</div></div>}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   ROOT
═══════════════════════════════════════════════════════════════════ */
function App(){
  const[session,setSession]=useState(undefined);
  const[aData,setAData]=useState(null);const[rData,setRData]=useState(null);const[mData,setMData]=useState(null);

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session:s}})=>setSession(s||null));
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>setSession(s||null));
    return()=>subscription.unsubscribe();
  },[]);

  const handleAuth=(s)=>setSession(s);
  const ready=(a,r,m)=>{setAData(a);setRData(r);setMData(m||{});};
  const reset=async()=>{setAData(null);setRData(null);setMData(null);};
  const logout=async()=>{await sb.auth.signOut();setAData(null);setRData(null);setMData(null);setSession(null);};

  if(session===undefined)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#f0eeff,#f9fafb)"}}>
      <Spin/>
    </div>
  );
  if(!session)return<AuthScreen onAuth={handleAuth}/>;
  if(aData)return<MainApp analysis={aData} reviews={rData} meta={mData} onReset={reset} session={session} onLogout={logout}/>;
  return<SetupScreen onReady={ready} session={session} onLogout={logout}/>;
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
